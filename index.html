<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Bot - Simulador de Lógica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; opacity: 0.1; position: absolute; top:0; left:0; right:0; bottom:0; z-index: 0; }
        .message-in { background-color: #202c33; border-radius: 0 10px 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 80%; position: relative; z-index: 10; font-size: 14px; }
        .message-out { background-color: #005c4b; border-radius: 10px 0 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 80%; margin-left: auto; position: relative; z-index: 10; font-size: 14px; }
        .json-view { font-family: 'Courier New', Courier, monospace; font-size: 12px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111b21; }
        ::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <div class="w-full md:w-1/3 flex flex-col border-r border-gray-700 relative bg-[#0b141a]">
        <div class="chat-bg pointer-events-none"></div>
        
        <div class="bg-[#202c33] p-3 flex items-center justify-between z-20 shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white font-bold">P</div>
                <div>
                    <h3 class="font-semibold text-gray-100">Pandda Bot</h3>
                    <p class="text-xs text-gray-400">Online via Termux</p>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <label class="text-[10px] text-gray-400">Hora Simulada:</label>
                <input type="number" id="simulatedHour" class="bg-gray-700 text-white text-xs p-1 rounded w-16 text-center" min="0" max="23" value="10">
            </div>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 z-10 flex flex-col">
            </div>

        <div class="bg-[#202c33] p-3 flex gap-2 z-20">
            <input type="text" id="userInput" class="flex-1 bg-[#2a3942] rounded-lg px-4 py-2 text-white outline-none focus:ring-1 focus:ring-green-500" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-[#00a884] w-10 h-10 rounded-full flex items-center justify-center hover:bg-[#008f6f] transition"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="w-full md:w-2/3 bg-[#0b141a] flex flex-col p-4 gap-4 overflow-hidden">
        
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-green-400"><i class="fas fa-server mr-2"></i>Dashboard do Sistema</h2>
            <button onclick="resetSystem()" class="text-xs bg-red-600 px-3 py-1 rounded hover:bg-red-700">Reiniciar Sessão</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-full overflow-hidden">
            
            <div class="bg-[#1f2937] rounded-lg p-4 flex flex-col border border-gray-700 shadow-lg">
                <h3 class="text-blue-400 font-bold mb-2 text-sm uppercase"><i class="fas fa-database mr-2"></i>Supabase (Tabela: Sessions)</h3>
                <div class="flex-1 bg-black rounded p-3 overflow-y-auto json-view text-green-300" id="supabaseView">
                    // Aguardando interação...
                </div>
            </div>

            <div class="bg-[#1f2937] rounded-lg p-4 flex flex-col border border-gray-700 shadow-lg">
                <h3 class="text-indigo-400 font-bold mb-2 text-sm uppercase"><i class="fab fa-discord mr-2"></i>Logs & Webhooks</h3>
                <div class="flex-1 bg-black rounded p-3 overflow-y-auto json-view text-gray-300" id="logsView">
                    // Logs de sistema...
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DO SISTEMA ---
        const CONFIG = {
            prices: { base: 34.90, extra: 17.90 },
            hours: { open: 9, close: 20 },
            sessionTimeout: 30, // minutos
            links: {
                payment: "https://pagar.pandda.vip/",
                guide: "pandda.vip/guia"
            }
        };

        // --- ESTADO INICIAL (Sessão do Usuário) ---
        let session = {
            phone: "5511999999999",
            status: "IDLE", // IDLE, MENU, TEST_FLOW, BUY_FLOW
            step: 0,
            last_interaction: new Date(),
            temp_data: {} // Armazena dados temporários (nome, horário agendado, telas)
        };

        // --- LÓGICA DO BOT ---

        function processBotLogic(input) {
            const hour = parseInt(document.getElementById('simulatedHour').value);
            const cleanInput = input.trim();
            
            // Log de entrada
            addLog("INPUT", `Usuário enviou: "${cleanInput}"`);

            // Atualiza timestamp
            session.last_interaction = new Date();
            updateSupabaseView();

            // 1. Verifica estado IDLE ou Resposta Genérica
            if (session.status === "IDLE") {
                sendGreeting(hour);
                session.status = "MENU";
                session.step = 0;
                updateSupabaseView();
                return;
            }

            // 2. Roteamento baseado no Status
            switch (session.status) {
                case "MENU":
                    handleMenu(cleanInput);
                    break;
                case "TEST_FLOW":
                    handleTestFlow(cleanInput, hour);
                    break;
                case "BUY_FLOW":
                    handleBuyFlow(cleanInput);
                    break;
                default:
                    botReply("Erro de estado. Digite 'oi' para reiniciar.");
                    session.status = "IDLE";
            }
        }

        // --- HANDLERS DE FLUXO ---

        function handleMenu(input) {
            switch (input) {
                case "1": // Como funciona
                    botReply(`*Como funciona o Plano DualAPP*\n\nÉ simples! Instale o APP adequado clicando no nosso guia completo: ${CONFIG.links.guide}\n\n✅ Compatível com Smart TVs, TV Box, Celulares.\n✅ Funciona via Internet.\n✅ Validade de 30 dias.\n✅ Possibilidade de telas adicionais.`);
                    setTimeout(() => sendMainMenu(), 2000); // Reenvia menu após leitura
                    break;
                case "2": // Planos
                    botReply(`*Nossos Planos*\n\n📺 *Plano DualAPP Base* (1 Tela): R$ ${CONFIG.prices.base.toFixed(2)}\n📺 *Tela Adicional*: + R$ ${CONFIG.prices.extra.toFixed(2)} cada\n\nQualidade máxima e acesso a 2 APPs para maior disponibilidade!`);
                    setTimeout(() => sendMainMenu(), 2000);
                    break;
                case "3": // Assine
                    startBuyFlow();
                    break;
                case "4": // Teste
                    startTestFlow();
                    break;
                case "5": // Dúvidas
                    botReply(`*Dúvidas Frequentes*\n\n🔸 *Posso assistir em mais de um aparelho?*\nSim, se contratar telas adicionais. O plano base é para 1 reprodução simultânea.\n\n🔸 *Posso assistir no celular?*\nSim! Basta baixar o app no nosso guia.\n\n🔸 *Precisa de antena?*\nNão, apenas internet.`);
                    setTimeout(() => sendMainMenu(), 3000);
                    break;
                case "6": // Falar com atendente
                    botReply("Um atendente humano foi notificado e entrará em contato em breve.");
                    addLog("DISCORD", "🔔 ALERTA: Solicitação de atendimento humano.");
                    break;
                default:
                    botReply("Opção inválida. Por favor, escolha um número do menu.");
                    break;
            }
        }

        // --- FLUXO DE COMPRA ---
        function startBuyFlow() {
            session.status = "BUY_FLOW";
            session.step = 1;
            session.temp_data = {};
            updateSupabaseView();
            botReply(`*Assinatura DualAPP* 🚀\n\nNosso plano custa R$${CONFIG.prices.base.toFixed(2)} (1 tela) com validade de 1 mês.\nTelas adicionais: R$${CONFIG.prices.extra.toFixed(2)} cada.\n\n1️⃣ Quero assinar o Plano Base\n2️⃣ Quero adicionar mais telas`);
        }

        function handleBuyFlow(input) {
            // Passo 1: Escolha do tipo
            if (session.step === 1) {
                if (input === "1") {
                    generateCheckout(1);
                } else if (input === "2") {
                    session.step = 2;
                    botReply("Quantas telas gostaria no total?\n\nDigite *2* ou *3* (Máximo atual)\nDigite *0* para voltar.");
                } else {
                    botReply("Opção inválida. Digite 1 ou 2.");
                }
                updateSupabaseView();
                return;
            }

            // Passo 2: Quantidade de telas
            if (session.step === 2) {
                if (input === "0") {
                    startBuyFlow();
                    return;
                }
                if (["2", "3"].includes(input)) {
                    // Mostrar resumo de valores
                    const qtd = parseInt(input);
                    let total = CONFIG.prices.base + (CONFIG.prices.extra * (qtd - 1));
                    botReply(`Calculando para ${qtd} telas...\nTotal: R$ ${total.toFixed(2)}`);
                    setTimeout(() => generateCheckout(qtd), 1000);
                } else {
                    botReply("Por favor, digite 2 ou 3.");
                }
            }
        }

        function generateCheckout(screens) {
            const code = Math.random().toString(36).substring(7).toUpperCase();
            const link = `${CONFIG.links.payment}${code}`;
            const total = CONFIG.prices.base + (CONFIG.prices.extra * (screens - 1));
            
            botReply(`Falta pouco! 🐼\n\nFaça o pagamento clicando no link seguro:\n🔗 ${link}\n\nAssim que aprovado, você receberá seus dados aqui.`);
            
            // Simular DB e Log
            addLog("SUPABASE", `INSERT INTO payments (code, user, amount, screens) VALUES ('${code}', '${session.phone}', ${total}, ${screens})`);
            addLog("MERCADOPAGO", `Gerando preferência de R$${total.toFixed(2)} para URL ${link}`);
            
            // Resetar para menu após um tempo ou manter sessão aberta aguardando webhook
            session.status = "IDLE"; 
            session.temp_data = { awaiting_payment: code };
            updateSupabaseView();
        }

        // --- FLUXO DE TESTE ---
        function startTestFlow() {
            session.status = "TEST_FLOW";
            session.temp_data = {};
            botReply("Para testar é simples! Instale 2 apps do nosso guia: pandda.vip/guia\n\nO teste dura 6h (contadas a partir do envio do login).");
            
            setTimeout(() => {
                const hour = parseInt(document.getElementById('simulatedHour').value);
                
                // Verifica horário comercial
                if (hour >= CONFIG.hours.open && hour < CONFIG.hours.close) {
                    session.step = 1; // Modo escolha
                    botReply("1️⃣ Iniciar teste o mais breve possível\n2️⃣ Agendar para outro horário");
                } else {
                    session.step = 2; // Força agendamento
                    botReply(`Estamos fora do horário de envio imediato (09h às 20h).\nVamos agendar seu teste!`);
                    askReferral();
                }
                updateSupabaseView();
            }, 1000);
        }

        function handleTestFlow(input, currentHour) {
            // Passo 1: Escolha Imediato vs Agendado (Só aparece se estiver no horário)
            if (session.step === 1) {
                if (input === "1") {
                    session.temp_data.mode = "NOW";
                    askReferral();
                } else if (input === "2") {
                    session.temp_data.mode = "SCHEDULE";
                    askReferral();
                } else {
                    botReply("Digite 1 ou 2.");
                }
                return;
            }

            // Passo 2: Código de Indicação (Lógica compartilhada)
            if (session.step === 2) {
                // Validação simples de código
                if (input.length > 3) {
                    session.temp_data.referral = input;
                    session.temp_data.duration = "24h";
                    botReply("✅ Código válido! Seu teste será de 24h e seu indicador ganha desconto.");
                } else {
                    session.temp_data.referral = null;
                    session.temp_data.duration = "6h";
                    botReply("Sem código ou código curto. Seu teste será de 6h.");
                }
                
                // Decide próximo passo basead no modo
                if (session.temp_data.mode === "NOW" || (currentHour >= CONFIG.hours.open && currentHour < CONFIG.hours.close && session.temp_data.mode !== "SCHEDULE")) {
                    // Se for AGORA
                    session.temp_data.schedule_time = "Imediato";
                    session.step = 4; // Pula agendamento
                    botReply("Qual seu nome para gerarmos o teste?");
                } else {
                    // Vai para agendamento
                    session.step = 3;
                    showAvailableHours(currentHour);
                }
                updateSupabaseView();
                return;
            }

            // Passo 3: Selecionar Horário
            if (session.step === 3) {
                const chosen = parseInt(input);
                if (chosen > currentHour && chosen <= CONFIG.hours.close && chosen >= CONFIG.hours.open) {
                    session.temp_data.schedule_time = chosen + ":00";
                    session.step = 4;
                    botReply(`Agendado para ${session.temp_data.schedule_time}. Qual seu nome?`);
                } else {
                    botReply("Horário inválido. Escolha uma das opções da lista acima.");
                }
                updateSupabaseView();
                return;
            }

            // Passo 4: Nome
            if (session.step === 4) {
                session.temp_data.name = input;
                session.step = 5;
                
                let resumo = `📋 *Resumo da Solicitação*\n\n👤 Nome: ${session.temp_data.name}\n🕒 Início: ${session.temp_data.schedule_time || "Imediato"}\n⏳ Duração: ${session.temp_data.duration}\n🎟 Código: ${session.temp_data.referral || "Nenhum"}`;
                
                botReply(resumo);
                setTimeout(() => botReply("Os dados estão corretos?\n1️⃣ Sim, confirmar\n2️⃣ Não, alterar Nome"), 500);
                updateSupabaseView();
                return;
            }

            // Passo 5: Confirmação
            if (session.step === 5) {
                if (input === "1") {
                    botReply("✅ Solicitação enviada! Aguarde, em breve você receberá os dados de acesso.");
                    
                    // Disparo Discord
                    const discordPayload = {
                        title: "🚀 Nova Solicitação de Teste",
                        fields: [
                            { name: "Cliente", value: session.temp_data.name },
                            { name: "Horário", value: session.temp_data.schedule_time },
                            { name: "Indicação", value: session.temp_data.referral || "N/A" }
                        ]
                    };
                    addLog("DISCORD", JSON.stringify(discordPayload, null, 2));
                    
                    session.status = "IDLE";
                } else if (input === "2") {
                    session.step = 4;
                    botReply("Ok, digite seu nome novamente:");
                }
                updateSupabaseView();
                return;
            }
        }

        // --- FUNÇÕES AUXILIARES ---

        function sendGreeting(hour) {
            let greeting = "Boa noite";
            if (hour >= 5 && hour < 12) greeting = "Bom dia";
            else if (hour >= 12 && hour < 18) greeting = "Boa tarde";

            botReply(`🐼 ${greeting}! Bem-vindo ao *Pandda IPTV*.\nEu sou seu assistente virtual.`);
            setTimeout(() => sendMainMenu(), 800);
        }

        function sendMainMenu() {
            botReply(`Escolha uma opção:\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente`);
        }

        function askReferral() {
            session.step = 2; // Estado de esperar código
            botReply("Você possui algum código de indicação? (Digite o código ou 'não')");
            updateSupabaseView();
        }

        function showAvailableHours(currentHour) {
            let options = [];
            // Lógica: Se for antes das 9, começa do 9. Se for depois, começa da hora atual + 1
            let start = currentHour < 9 ? 9 : currentHour + 1;
            
            for (let h = start; h <= 20; h++) {
                options.push(`${h}h`);
            }
            
            if (options.length === 0) {
                botReply("Não há mais horários disponíveis hoje. Tente amanhã.");
                session.status = "IDLE";
            } else {
                botReply(`Horários disponíveis para hoje:\n${options.join(", ")}\n\nDigite apenas o número (ex: 16)`);
            }
        }

        // --- FUNÇÕES DE UI ---

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value;
            if (!text) return;

            // Renderiza msg do usuário
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-out text-white';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Processa lógica
            setTimeout(() => processBotLogic(text), 500);
        }

        function botReply(text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-in text-white';
            // Converte quebras de linha e negrito simples
            msgDiv.innerHTML = text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateSupabaseView() {
            const view = document.getElementById('supabaseView');
            view.innerText = JSON.stringify(session, null, 4);
        }

        function addLog(type, message) {
            const view = document.getElementById('logsView');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] [${type}] ${message}\n----------------------------------\n`;
            view.innerText = logEntry + view.innerText;
        }

        function resetSystem() {
            session = { phone: "5511999999999", status: "IDLE", step: 0, last_interaction: new Date(), temp_data: {} };
            document.getElementById('chatBox').innerHTML = '';
            document.getElementById('logsView').innerText = '// Logs resetados...';
            updateSupabaseView();
            botReply("Sistema reiniciado. Digite algo para começar.");
        }

        // Inicialização
        updateSupabaseView();
        botReply("Sistema Inicializado. Digite 'oi' para começar.");

    </script>
</body>
</html>
