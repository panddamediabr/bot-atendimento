<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Engine Master 🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GERAIS --- */
        :root {
            --primary: #00a884; --bg-chat: #e5ddd5; --my-msg: #d9fdd3; --bot-msg: #ffffff;
            --dark-panel: #202c33; --text-panel: #d1d7db;
            --log-bg: #1e1e1e; --log-text: #d4d4d4;
            /* Cores de Sintaxe Log */
            --key-color: #9cdcfe; --string-color: #ce9178; --bool-color: #569cd6; --num-color: #b5cea8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; height: 100vh; overflow: hidden; background-color: #f0f2f5; }

        /* --- GRID LAYOUT --- */
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr 500px; /* Config | Chat | Logs */
            width: 100%; height: 100%;
        }

        /* --- 1. CONFIGURAÇÕES (Painel Esquerdo) --- */
        .settings-panel {
            background-color: var(--dark-panel); color: var(--text-panel);
            padding: 20px; border-right: 1px solid #333; overflow-y: auto;
        }
        .settings-panel h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #8696a0; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #2a3942; border: none; color: #fff; border-radius: 6px;
        }
        
        /* Time Travel Box */
        .time-box {
            border: 1px solid #ffd700; background: rgba(255, 215, 0, 0.05);
            padding: 10px; border-radius: 8px; margin-bottom: 20px;
        }
        .time-label { color: #ffd700; font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px; }
        
        .btn-action {
            width: 100%; padding: 12px; margin-top: 10px; background: var(--primary);
            color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .btn-action:hover { opacity: 0.9; }

        .status-box {
            margin-top: 30px; padding: 15px; background: #111b21; border-radius: 6px;
            font-family: 'Fira Code', monospace; font-size: 0.75rem; border: 1px solid #333;
        }

        /* --- 2. CHAT (Painel Central) --- */
        .chat-area {
            background-color: #d1d7db;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .phone-mockup {
            width: 100%; max-width: 480px; height: 100%; max-height: 95vh;
            background-color: var(--bg-chat); display: flex; flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
        }
        .chat-header {
            background-color: var(--dark-panel); color: white; padding: 10px 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .profile-pic { width: 35px; height: 35px; background: #fff; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; }
        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .message {
            max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4;
            position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word;
        }
        .bot { background-color: var(--bot-msg); align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
        .user { background-color: var(--my-msg); align-self: flex-end; border-top-right-radius: 0; color: #111b21; }
        
        .chat-input-area {
            background: var(--dark-panel); padding: 10px; display: flex; gap: 10px;
        }
        .chat-input-area input {
            flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none;
        }

        /* --- 3. LOGS (Painel Direito) --- */
        .logs-panel {
            background-color: var(--log-bg); color: var(--log-text);
            padding: 10px; font-family: 'Fira Code', monospace; overflow-y: auto; border-left: 1px solid #333;
            font-size: 0.8rem;
        }
        .log-entry {
            background: #252526; margin-bottom: 8px; border-left: 3px solid transparent; padding: 8px; border-radius: 4px;
        }
        /* Cores de Borda por Tipo */
        .border-ENGINE { border-left-color: #ffd700; }
        .border-SERVER { border-left-color: #c586c0; }
        .border-DB { border-left-color: #007acc; }
        .border-WEBHOOK { border-left-color: #5865F2; }
        .border-TIME { border-left-color: #00ff9d; }

        /* Tags */
        .log-tag { font-weight: bold; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; color: #000; margin-right: 8px; }
        .tag-ENGINE { background: #ffd700; }
        .tag-SERVER { background: #c586c0; color: #fff; }
        .tag-DB { background: #007acc; color: #fff; }
        .tag-WEBHOOK { background: #5865F2; color: #fff; }
        .tag-TIME { background: #00ff9d; }

        .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        .log-data { white-space: pre-wrap; word-break: break-all; margin-top: 5px; line-height: 1.4; }
        
        /* Sintaxe JSON */
        .json-key { color: var(--key-color); }
        .json-string { color: var(--string-color); }
        .json-bool { color: var(--bool-color); font-weight: bold; }
        .json-num { color: var(--num-color); }
        .json-null { color: #569cd6; font-style: italic; }

        /* Mobile */
        .mobile-toggle { display: none; position: fixed; top: 10px; right: 10px; z-index: 1000; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 0px 1fr 0px; }
            .settings-panel, .logs-panel { display: none; position: absolute; z-index: 100; width: 90%; height: 100%; top: 0; }
            .settings-panel { left: 0; border-right: 2px solid var(--primary); }
            .logs-panel { right: 0; border-left: 2px solid var(--primary); }
            .app-container.show-config .settings-panel { display: block; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

    <button class="mobile-toggle" onclick="toggleConfig()">⚙️</button>

    <div class="app-container" id="appContainer">
        
        <aside class="settings-panel">
            <h2>⚙️ Pandda Config</h2>
            
            <div class="time-box">
                <label class="time-label">⏰ Horário Simulado</label>
                <input type="time" id="simulatedTime" value="09:00" onchange="updatePhoneClock()">
                <div style="font-size: 0.7rem; color: #aaa; margin-top: 5px;">
                    Altere para testar Bom Dia (05-12), Boa Tarde (12-18) ou Boa Noite (18-05).
                </div>
            </div>

            <div class="form-group">
                <label>Expediente Teste (Início/Fim)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="time" id="workStart" value="09:00">
                    <input type="time" id="workEnd" value="20:00">
                </div>
            </div>

            <div class="form-group">
                <label>Códigos Válidos (CSV)</label>
                <input type="text" id="validCodes" value="PANDDA10, VIP2024, TESTE">
            </div>

            <div class="form-group">
                <label>Delay (ms/char)</label>
                <input type="number" id="msPerChar" value="45">
            </div>
            
            <button class="btn-action" onclick="restartChat()">🔄 Reiniciar Chat</button>
            <button class="btn-action" style="background: #333; margin-top: 5px;" onclick="clearLogs()">🗑️ Limpar Logs</button>

            <div class="status-box">
                <div>ESTADO: <span id="displayState" style="color: var(--primary)">START</span></div>
                <div>SESSÃO: <span id="displaySession">...</span></div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="phone-mockup">
                <div class="chat-header">
                    <div class="header-info">
                        <div class="profile-pic">🐼</div>
                        <div>
                            <div style="font-weight: 500;">Pandda Bot</div>
                            <div style="font-size: 0.75rem; opacity: 0.8;">Online</div>
                        </div>
                    </div>
                    <div id="phoneClock" style="font-size: 0.8rem; font-weight: bold; opacity: 0.8;">09:00</div>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                    <button onclick="sendUserMessage()" style="background:none; border:none; font-size: 1.2rem; cursor: pointer;">➤</button>
                </div>
            </div>
        </main>

        <aside class="logs-panel" id="logsPanel">
            </aside>

    </div>

    <script>
        /* =================================================================
           1. SISTEMA DE LOGS & FORMATAÇÃO
           ================================================================= */
        function formatJSON(obj) {
            let json = JSON.stringify(obj, null, 2);
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-num';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) cls = 'json-key';
                    else cls = 'json-string';
                } else if (/true|false/.test(match)) cls = 'json-bool';
                else if (/null/.test(match)) cls = 'json-null';
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function logger(type, title, data) {
            const panel = document.getElementById('logsPanel');
            const simTime = document.getElementById('simulatedTime').value;
            
            const html = `
                <div class="log-entry border-${type}">
                    <div class="log-header">
                        <div>
                            <span class="log-tag tag-${type}">${type}</span>
                            <span style="font-weight:bold; color:#fff;">${title}</span>
                        </div>
                        <span style="color:#666; font-size:0.7rem;">${simTime}</span>
                    </div>
                    <div class="log-data">${formatJSON(data)}</div>
                </div>
            `;
            panel.insertAdjacentHTML('afterbegin', html);
        }

        /* =================================================================
           2. ENGINE DE TEMPO & SAUDAÇÃO
           ================================================================= */
        function getSimulatedDate() {
            const simTime = document.getElementById('simulatedTime').value;
            const now = new Date();
            const [h, m] = simTime.split(':');
            now.setHours(h, m, 0, 0);
            return now;
        }

        function updatePhoneClock() {
            document.getElementById('phoneClock').innerText = document.getElementById('simulatedTime').value;
        }

        function getGreeting() {
            const h = getSimulatedDate().getHours();
            let p = "";
            let t = "";

            if (h >= 5 && h < 12) {
                p = "Manhã"; t = "{Bom dia|Olá, bom dia|Dia}";
            } else if (h >= 12 && h < 18) {
                p = "Tarde"; t = "{Boa tarde|Olá, boa tarde|Tarde}";
            } else {
                p = "Noite"; t = "{Boa noite|Olá, boa noite|Noite}";
            }

            logger('TIME', 'Saudação Detectada', { hora: h, periodo: p, template: t });
            return t;
        }

        function isBusinessHours() {
            const now = getSimulatedDate();
            const nowVal = now.getHours() * 60 + now.getMinutes();
            
            const [sH, sM] = document.getElementById('workStart').value.split(':');
            const [eH, eM] = document.getElementById('workEnd').value.split(':');
            
            const startVal = parseInt(sH) * 60 + parseInt(sM);
            const endVal = parseInt(eH) * 60 + parseInt(eM);

            const isOpen = nowVal >= startVal && nowVal < endVal;
            logger('TIME', 'Verificação Expediente', { aberto: isOpen, agora: nowVal, inicio: startVal, fim: endVal });
            return isOpen;
        }

        /* =================================================================
           3. CORE: SPINTAX & DELAY SERVER-SIDE
           ================================================================= */
        function processSpintax(text) {
            return text.replace(/\{([^{}]+)\}/g, (match, group) => {
                const options = group.split('|');
                return options[Math.floor(Math.random() * options.length)];
            });
        }

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function calculateServerDelay(textLength) {
            const msPerChar = parseInt(document.getElementById('msPerChar').value);
            const baseLatency = 1000;
            const typingTime = textLength * msPerChar;
            
            // Jitter (Variação de 20%)
            const jitter = typingTime * 0.2;
            const randomJitter = (Math.random() * jitter * 2) - jitter;
            
            const total = baseLatency + typingTime + randomJitter;
            return Math.floor(Math.max(1000, Math.min(8000, total)));
        }

        /* =================================================================
           4. FLUXOS DE CONVERSA (MASTER)
           ================================================================= */
        const Session = { id: 'SES-' + Math.floor(Math.random()*9999), state: 'START', data: {} };

        // --- MENU PRINCIPAL ---
        const FlowMenu = {
            getOptions: () => {
                const greet = getGreeting();
                const intro = `${greet}, {tudo bem?|como vai?|tudo certo?}. Eu sou o Pandda 🐼.`;
                const menu = "1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assinar\n4️⃣ Testar\n5️⃣ Dúvidas\n6️⃣ Falar com atendente";
                return [intro, menu];
            },
            handle: (input) => {
                switch(input) {
                    case '1': return FlowHowItWorks.start();
                    case '2': return FlowPlans.start();
                    case '3': return FlowSigning.start();
                    case '4': return FlowTesting.start();
                    case '5': return FlowFAQ.start();
                    case '6': return FlowSupport.start();
                    default: return { text: ["Opção inválida. Digite de 1 a 6."], newState: 'MENU' };
                }
            }
        };

        // --- COMO FUNCIONA ---
        const FlowHowItWorks = {
            phrases: [
                "Funciona 100% via {internet|conexão web} 🌐",
                "Sem {cabos|antenas|aparelhos extras}.",
                "Compatível com Smart TV, Celular, TV Box e PC 📺",
                "Sistema **DualAPP**: 2 apps para {maior estabilidade|não travar} 🚀",
                "Basta instalar e logar com os dados que fornecemos 🔑"
            ],
            start: () => {
                // Embaralha frases + Spintax
                const shuffled = shuffleArray(FlowHowItWorks.phrases).map(t => processSpintax(t));
                logger('ENGINE', 'Shuffle HowItWorks', { count: shuffled.length });
                return { text: ["Veja como é simples:", ...shuffled, "Digite 0 para voltar."], newState: 'MENU' };
            }
        };

        // --- PLANOS ---
        const FlowPlans = {
            start: () => ({
                text: [
                    "Confira nossos planos Mensais (DualAPP):",
                    "1️⃣ **Plano Base (1 tela):** R$ 34,90\n2️⃣ **Plano Dual (2 telas):** R$ 52,80\n3️⃣ **Plano Família (3 telas):** R$ 70,70",
                    "Digite **3** para Assinar agora ou **0** para Voltar."
                ],
                newState: 'MENU'
            })
        };

        // --- ASSINATURA ---
        const FlowSigning = {
            start: () => ({ text: ["Qual plano deseja? (Digite 1, 2 ou 3)"], newState: 'SIGN_PLAN' }),
            handle: (input, state) => {
                if (state === 'SIGN_PLAN') {
                    Session.data.plan = input;
                    return { text: ["Possui código de indicação? Se sim, digite. Se não, digite **Não**."], newState: 'SIGN_CODE' };
                }
                if (state === 'SIGN_CODE') {
                    const clean = input.toLowerCase().replace(/['"]/g, '').trim();
                    if (['nao', 'não', 'n'].includes(clean)) {
                        Session.data.code = null;
                        return { text: ["Sem código. Deseja canais Adultos? (Sim/Não)"], newState: 'SIGN_ADULT' };
                    }
                    
                    // Validação Mock DB
                    const validList = document.getElementById('validCodes').value.toUpperCase().split(',').map(c=>c.trim());
                    const isValid = validList.includes(input.toUpperCase());
                    
                    logger('DB', 'Validação Código', { input: input, valido: isValid });
                    
                    if (isValid) {
                        Session.data.code = input.toUpperCase();
                        return { text: ["Código Válido! ✅ Ganhou bônus. Deseja Adultos? (Sim/Não)"], newState: 'SIGN_ADULT' };
                    } else {
                        return { text: ["Código inválido ❌. Tente novamente ou digite 'Não'."], newState: 'SIGN_CODE' };
                    }
                }
                if (state === 'SIGN_ADULT') {
                    Session.data.adult = input;
                    const url = `pagar.pandda.vip?ref=${Session.id}&plan=${Session.data.plan}`;
                    
                    logger('WEBHOOK', 'Pagamento Criado (Discord)', { 
                        canal: '#pagamentos', 
                        plano: Session.data.plan, 
                        adulto: input, 
                        url: url 
                    });
                    
                    return { 
                        text: [
                            "📝 **Resumo do Pedido:**",
                            `Plano: Opção ${Session.data.plan}`,
                            `Código: ${Session.data.code || 'Nenhum'}`,
                            `Adulto: ${input}`,
                            `🔗 Link: ${url}`,
                            "Aguardando confirmação..."
                        ], 
                        newState: 'MENU' 
                    };
                }
            }
        };

        // --- TESTE ---
        const FlowTesting = {
            start: () => {
                if (isBusinessHours()) {
                    return { 
                        text: ["Instale o app: pandda.vip/guia", "Digite **1** p/ Testar Agora ou **2** p/ Agendar."], 
                        newState: 'TEST_OPT' 
                    };
                } else {
                    const [sH, sM] = document.getElementById('workStart').value.split(':');
                    const [eH, eM] = document.getElementById('workEnd').value.split(':');
                    return {
                        text: [
                            `Ops! Geração de testes apenas das ${sH}:${sM} às ${eH}:${eM}. 🕒`,
                            "Mas você pode agendar para amanhã.",
                            "Digite **2** para Agendar."
                        ],
                        newState: 'TEST_OPT' // Força usuário a escolher 2 ou desistir
                    };
                }
            },
            handle: (input, state) => {
                if (state === 'TEST_OPT') {
                    if (input === '1') {
                        if (!isBusinessHours()) return { text: ["Horário encerrado. Digite 2 para agendar."], newState: 'TEST_OPT' };
                        return { text: ["Ok! Qual o seu Nome?"], newState: 'TEST_NAME' };
                    } else {
                        return { text: ["Para qual horário deseja agendar? (Ex: 10h)"], newState: 'TEST_SCHEDULE' };
                    }
                }
                if (state === 'TEST_SCHEDULE') {
                    Session.data.schedule = input;
                    return { text: ["Certo. Qual seu nome?"], newState: 'TEST_NAME' };
                }
                if (state === 'TEST_NAME') {
                    Session.data.name = input;
                    return { text: ["Tem código de indicação? (Digite o código ou Não)"], newState: 'TEST_CODE' };
                }
                if (state === 'TEST_CODE') {
                    const clean = input.toLowerCase().replace(/['"]/g, '').trim();
                    if (!['nao', 'não', 'n'].includes(clean)) {
                        Session.data.code = input; // Aceita qualquer coisa no teste ou valida se quiser
                    }
                    return { text: ["Liberar conteúdo Adulto? (Sim/Não)"], newState: 'TEST_ADULT' };
                }
                if (state === 'TEST_ADULT') {
                    Session.data.adult = input;
                    
                    logger('WEBHOOK', 'Solicitação Teste (Discord)', {
                        canal: '#solicitacoes-teste',
                        nome: Session.data.name,
                        horario: Session.data.schedule || 'Agora',
                        adulto: input
                    });

                    return { 
                        text: [`Obrigado ${Session.data.name}! Solicitação enviada. Aguarde seus dados.`], 
                        newState: 'MENU' 
                    };
                }
            }
        };

        // --- FAQ ---
        const FlowFAQ = {
            qs: [
                "**Onde usar?** 🌍 Smart TV, Celular, PC.",
                "**Pagamento?** 💳 Pix e Cartão.",
                "**É assinatura?** ✍️ Não, é pré-pago sem fidelidade.",
                "**Quantas telas?** 📺 1, 2 ou 3 dependendo do plano."
            ],
            start: () => {
                const shuffled = shuffleArray(FlowFAQ.qs);
                return { text: ["Dúvidas frequentes:", ...shuffled, "Mais em: pandda.vip/FAQ"], newState: 'MENU' };
            }
        };

        // --- SUPORTE ---
        const FlowSupport = {
            start: () => {
                logger('WEBHOOK', 'Chamar Humano', { session: Session.id });
                return { text: ["Chamando um atendente humano... 👩‍💻 Aguarde."], newState: 'MENU' };
            }
        };

        /* =================================================================
           5. CONTROLADOR (ROUTER)
           ================================================================= */
        async function processMessage(msg) {
            const clean = msg.trim();
            
            // Global Reset
            if (clean === '0') {
                Session.state = 'MENU';
                Session.data = {};
                const res = FlowMenu.getOptions();
                await sendBotMessages(res);
                return;
            }

            let response = { text: [], newState: Session.state };

            // Router
            if (Session.state === 'START') {
                const res = FlowMenu.getOptions();
                response = { text: res, newState: 'MENU' };
            }
            else if (Session.state === 'MENU') {
                response = FlowMenu.handle(clean);
            }
            else if (Session.state.startsWith('SIGN')) {
                response = FlowSigning.handle(clean, Session.state);
            }
            else if (Session.state.startsWith('TEST')) {
                response = FlowTesting.handle(clean, Session.state);
            }
            else {
                // Fallback
                response = { text: ["Não entendi. Digite 0 para voltar."], newState: Session.state };
            }

            // Update State
            if (response.newState) Session.state = response.newState;
            updateStatusUI();

            // Send
            if (response.text && response.text.length > 0) {
                await sendBotMessages(response.text);
            }
        }

        async function sendBotMessages(msgs) {
            for (let rawText of msgs) {
                const finalText = processSpintax(rawText);
                const delayMs = calculateServerDelay(finalText.length);
                
                logger('SERVER', '⏳ Delay', { chars: finalText.length, delay: delayMs + 'ms' });
                
                // Server Wait
                await new Promise(r => setTimeout(r, delayMs));
                
                addMsg(finalText, 'bot');
                // Pequena pausa entre mensagens
                await new Promise(r => setTimeout(r, 600));
            }
        }

        /* =================================================================
           6. UI HELPERS
           ================================================================= */
        function addMsg(txt, type) {
            const box = document.getElementById('chatBox');
            box.innerHTML += `<div class="message ${type}">${txt.replace(/\n/g,'<br>')}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function sendUserMessage() {
            const inp = document.getElementById('userInput');
            if(!inp.value) return;
            addMsg(inp.value, 'user');
            processMessage(inp.value);
            inp.value = '';
        }

        function handleEnter(e) { if(e.key === 'Enter') sendUserMessage(); }

        function updateStatusUI() {
            document.getElementById('displayState').innerText = Session.state;
            document.getElementById('displaySession').innerText = Session.id;
        }

        function restartChat() {
            document.getElementById('chatBox').innerHTML = '';
            document.getElementById('logsPanel').innerHTML = '';
            Session.state = 'START';
            Session.data = {};
            Session.id = 'SES-' + Math.floor(Math.random()*9999);
            updatePhoneClock();
            logger('SYSTEM', 'Reiniciando Sistema', {});
            processMessage('0');
        }

        function clearLogs() { document.getElementById('logsPanel').innerHTML = ''; }
        function toggleConfig() { document.getElementById('appContainer').classList.toggle('show-config'); }

        // Inicialização
        updatePhoneClock();
        setTimeout(() => restartChat(), 800);

    </script>
</body>
</html>
