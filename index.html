<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Engine Prototype 🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00a884; /* WhatsApp Green */
            --bg-chat: #e5ddd5;
            --my-msg: #d9fdd3;
            --bot-msg: #ffffff;
            --dark-panel: #202c33;
            --text-panel: #d1d7db;
            --log-bg: #111b21;
            --log-text: #00ff9d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; height: 100vh; display: flex; overflow: hidden; background-color: #f0f2f5; }

        /* --- LAYOUT GRID --- */
        .app-container {
            display: grid;
            grid-template-columns: 250px 1fr 350px; /* Desktop Default */
            width: 100%;
            height: 100%;
        }

        /* --- COLUNA 1: CONFIGURAÇÕES --- */
        .settings-panel {
            background-color: var(--dark-panel);
            color: var(--text-panel);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        .settings-panel h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border-radius: 5px; border: none; background: #2a3942; color: white;
        }
        .btn-save {
            width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        /* --- COLUNA 2: CHAT (CELULAR) --- */
        .chat-area {
            background-color: #dfdfdf;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .phone-mockup {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 900px;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); /* Pattern WhatsApp */
        }
        .chat-header {
            background-color: var(--primary);
            padding: 10px 15px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-pic { width: 40px; height: 40px; background: #ccc; border-radius: 50%; }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .bot { background-color: var(--bot-msg); align-self: flex-start; border-top-left-radius: 0; }
        .user { background-color: var(--my-msg); align-self: flex-end; border-top-right-radius: 0; }
        .chat-input-area {
            background: #f0f2f5;
            padding: 10px;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none;
        }
        .btn-send {
            background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .typing-indicator {
            font-size: 0.8rem; color: #666; font-style: italic; padding-left: 15px; margin-bottom: 5px; display: none;
        }

        /* --- COLUNA 3: LOGS E DEBUG --- */
        .logs-panel {
            background-color: var(--log-bg);
            color: var(--log-text);
            padding: 20px;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            border-left: 1px solid #333;
        }
        .log-entry { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .log-title { color: #fff; font-weight: bold; margin-bottom: 5px; }
        .log-json { font-size: 0.8rem; opacity: 0.8; white-space: pre-wrap; }
        .badge { display: inline-block; padding: 2px 5px; font-size: 0.7rem; border-radius: 3px; color: black; font-weight: bold; margin-right: 5px;}
        .badge-db { background: #3ecf8e; } /* Supabase Color */
        .badge-hook { background: #5865F2; } /* Discord Color */
        .badge-engine { background: #ff9900; } /* Engine Logic */

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 0px 1fr 300px; } /* Esconde Config */
            .settings-panel { display: none; }
        }

        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; } /* Só Chat */
            .settings-panel, .logs-panel { display: none; }
            .phone-mockup { max-width: 100%; border: none; }
            
            /* Botão mobile para ver configs */
            .mobile-menu-btn {
                display: block; position: fixed; top: 10px; right: 10px; z-index: 100;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="settings-panel">
            <h2>⚙️ Configurações Pandda</h2>
            <div class="form-group">
                <label>Status Admin:</label>
                <select id="adminStatus">
                    <option value="online">Online (Bot Ativo)</option>
                    <option value="maintenance">Manutenção</option>
                </select>
            </div>
            <div class="form-group">
                <label>Horário Início:</label>
                <input type="time" id="timeStart" value="09:00">
            </div>
            <div class="form-group">
                <label>Horário Fim:</label>
                <input type="time" id="timeEnd" value="20:00">
            </div>
            <div class="form-group">
                <label>Códigos Válidos (CSV):</label>
                <input type="text" id="validCodes" value="PANDDA10,VIP2024,TESTE01">
            </div>
            <button class="btn-save" onclick="resetChat()">Reiniciar Chat</button>
            
            <div style="margin-top: 30px; font-size: 0.8rem; color: #888;">
                <p>Status Atual:</p>
                <p id="currentStateDisplay">MÓDULO: MENU</p>
            </div>
        </div>

        <div class="chat-area">
            <div class="phone-mockup">
                <div class="chat-header">
                    <div class="profile-pic">🐼</div>
                    <div>
                        <div style="font-weight: bold;">Pandda Atendimento</div>
                        <div style="font-size: 0.8rem;">Online</div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">
                        Olá! Bem-vindo ao Pandda. Digite "Oi" para começar.
                    </div>
                </div>

                <div class="typing-indicator" id="typingIndicator">Pandda digitando...</div>

                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Digite uma mensagem..." onkeypress="handleEnter(event)">
                    <button class="btn-send" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>

        <div class="logs-panel" id="logsPanel">
            <div class="log-entry">
                <div class="log-title">🖥️ Console de Logs</div>
                <div class="log-json">Aguardando interação...</div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. CONFIGURAÇÃO & ESTADO ---
        let session = {
            step: 'start', // start, menu, plans, sign_code, sign_adult, test_guide, test_schedule, test_name, test_code, test_adult
            tempData: {} // Armazena dados temporários (nome, horario, etc)
        };

        // --- 2. ENGINE DE SPINTAX E FRASES ---
        
        // Função auxiliar para selecionar aleatório de array
        const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Função Spintax: Transforma "{Olá|Oi|E aí}" em uma opção
        const processSpintax = (text) => {
            return text.replace(/\{([^{}]+)\}/g, (match, content) => {
                const choices = content.split('|');
                return randomChoice(choices);
            });
        };

        // Banco de Frases (Templates)
        const templates = {
            greeting: "{Olá|Oi|Tudo bem?}, {Bom dia|Boa tarde|Boa noite}! Como {podemos te ajudar|posso ser útil|está você}? 🐼",
            menu: "Digite uma opção:\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assinar\n4️⃣ Testar\n5️⃣ Dúvidas\n6️⃣ Falar com atendente",
            
            how_it_works: [ // Lista para ser embaralhada
                "{Funciona|Roda} 100% via internet, sem precisar de {antenas|cabos}. 🌐",
                "Basta {instalar|baixar} nosso app no seu dispositivo.",
                "Nós fornecemos seus dados de {acesso|login} (usuário e senha). 🔑",
                "Compatível com Smart TV, Celular, TV Box e PC. 📺",
                "Sistema **DualAPP**: dois aplicativos para {maior estabilidade|não travar}. 🚀",
                "É só {logar|entrar} e {assistir|curtir}!"
            ],
            
            plans: "Temos o plano ideal:\n\n1️⃣ **Plano Base (1 tela):** R$ 34,90\n2️⃣ **Plano DualAPP (2 telas):** R$ 52,80\n3️⃣ **Plano DualAPP (3 telas):** R$ 70,70\n\n4️⃣ ✍️ **Assinar Agora**\n0️⃣ Voltar",
            
            faq: [ // Lista de FAQs
                "**Onde usar?** 🌍 Em qualquer lugar com internet.",
                "**Aparelhos?** 📺 Smart TV, Box, Stick, Celular, PC.",
                "**Pagamento?** 💳 PIX ou Cartão de Crédito.",
                "**Fidelidade?** ✍️ Não, pague apenas quando usar."
            ]
        };

        // --- 3. LÓGICA DE NEGÓCIO (Backend Simulado) ---

        function addLog(type, title, data) {
            const panel = document.getElementById('logsPanel');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            let badgeClass = 'badge-engine';
            if(type === 'DB') badgeClass = 'badge-db';
            if(type === 'WEBHOOK') badgeClass = 'badge-hook';

            entry.innerHTML = `
                <div class="log-title"><span class="badge ${badgeClass}">${type}</span> ${title}</div>
                <div class="log-json">${JSON.stringify(data, null, 2)}</div>
            `;
            panel.insertBefore(entry, panel.firstChild); // Adiciona no topo
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Simula verificação no Supabase
        function checkCodeSupabase(code) {
            const validCodes = document.getElementById('validCodes').value.split(',');
            const isValid = validCodes.includes(code.toUpperCase().trim());
            
            addLog('DB', 'SELECT * FROM codigos WHERE code = ?', {
                input: code,
                found: isValid
            });
            return isValid;
        }

        // Simula Webhook Mercado Pago/Discord
        function triggerWebhook(type, payload) {
            addLog('WEBHOOK', `Disparo para Discord: #${type}`, payload);
            if(type === 'pagamentos') {
                addLog('WEBHOOK', 'Mercado Pago: Link Gerado', { url: `pagar.pandda.vip?id=${Date.now()}` });
            }
        }

        // --- 4. FLUXO DE CONVERSA ---

        async function processBotResponse(input) {
            const cleanInput = input.trim().toLowerCase();
            let responseText = [];
            let nextStep = session.step;

            // --- Lógica de Navegação ---
            
            // MENU PRINCIPAL
            if (session.step === 'menu') {
                if (cleanInput === '1') { // Como Funciona
                    addLog('ENGINE', 'Shuffle & Spintax', { module: 'HowItWorks' });
                    const intro = "Veja como é simples:";
                    let shuffledTips = shuffleArray([...templates.how_it_works]).map(t => processSpintax(t));
                    responseText = [intro, ...shuffledTips];
                    
                } else if (cleanInput === '2') { // Planos
                    responseText = [processSpintax(templates.plans)];
                    
                } else if (cleanInput === '3' || cleanInput === '4' && session.lastMenu === 'plans') { // Assinar
                    nextStep = 'sign_plan';
                    responseText = ["Qual plano deseja? (Digite 1, 2 ou 3)"];
                    
                } else if (cleanInput === '4') { // Testar
                    nextStep = 'test_guide';
                    responseText = ["Para testar, instale o app: pandda.vip/guia", "Digite 1 para Testar Agora ou 2 para Agendar."];
                    
                } else if (cleanInput === '5') { // Dúvidas
                    addLog('ENGINE', 'Shuffle FAQ', { module: 'FAQ' });
                    let faqs = shuffleArray([...templates.faq]);
                    responseText = ["Aqui estão as dúvidas comuns:", ...faqs, "Mais em: pandda.vip/FAQ"];
                }
            }
            
            // FLUXO ASSINATURA
            else if (session.step === 'sign_plan') {
                session.tempData.plan = cleanInput;
                nextStep = 'sign_code';
                responseText = ["Possui código de indicação? Se sim, digite. Se não, digite 'não'."];
            }
            else if (session.step === 'sign_code') {
                if (['nao', 'não', 'n', '"não"'].some(v => cleanInput.includes(v))) {
                    session.tempData.code = null;
                    nextStep = 'sign_adult';
                    responseText = ["Entendido. Deseja liberar canais Adultos? (Sim/Não)"];
                } else {
                    const isValid = checkCodeSupabase(cleanInput);
                    if (isValid) {
                        session.tempData.code = cleanInput;
                        nextStep = 'sign_adult';
                        responseText = ["Código válido! ✅ Deseja liberar canais Adultos?"];
                    } else {
                        responseText = ["Código inválido. ❌ Tente novamente ou digite 'não'."];
                    }
                }
            }
            else if (session.step === 'sign_adult') {
                session.tempData.adult = cleanInput;
                nextStep = 'menu'; // Fim do fluxo
                
                // Gera Link e Dispara Webhooks
                triggerWebhook('pagamentos', session.tempData);
                
                responseText = [
                    "📝 Resumo do Pedido:",
                    `Plano: ${session.tempData.plan}`,
                    `Código: ${session.tempData.code || 'Nenhum'}`,
                    `Adulto: ${cleanInput}`,
                    "🔗 Link de pagamento: pagar.pandda.vip (Simulado)",
                    "Aguardando confirmação..."
                ];
                
                addLog('DB', 'UPDATE sessao SET status = finished', session.tempData);
                session.tempData = {}; // Limpa
            }

            // GATILHO INICIAL
            else if (session.step === 'start') {
                responseText = [processSpintax(templates.greeting), templates.menu];
                nextStep = 'menu';
            }

            // Atualiza Estado Visual
            session.step = nextStep;
            document.getElementById('currentStateDisplay').innerText = `ETAPA: ${nextStep.toUpperCase()}`;

            // Envia Respostas com Delay
            for (let msg of responseText) {
                await sendBotMessage(msg);
            }
        }

        // --- 5. INTERFACE (UI) ---

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            // Converte quebras de linha em <br> e markdown básico bold
            div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendBotMessage(text) {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'block';
            
            // Cálculo de Delay Humano: (Caracteres / 20) * 1000ms + Delay fixo
            const delay = Math.min((text.length / 20) * 1000 + 1000, 5000); 
            
            return new Promise(resolve => {
                setTimeout(() => {
                    indicator.style.display = 'none';
                    appendMessage(text, 'bot');
                    resolve();
                }, delay);
            });
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value;
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            // Processa resposta
            processBotResponse(text);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function resetChat() {
            document.getElementById('chatMessages').innerHTML = '';
            session.step = 'start';
            session.tempData = {};
            addLog('SYSTEM', 'Chat Reiniciado', {});
        }

        // Inicializa com log
        addLog('SYSTEM', 'Engine Pandda Iniciada', { version: '1.0.0-Prototype' });

    </script>
</body>
</html>
