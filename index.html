<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Bot V8 - Fluxo Otimizado</title>
    <style>
        :root { --whatsapp-green: #25D366; --bg-dark: #121b22; --panel-bg: #1f2c33; --text-light: #e9edef; --accent: #00a884; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-dark); color: var(--text-light); }
        #chat-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        #admin-panel { width: 380px; background: var(--panel-bg); padding: 20px; overflow-y: auto; border-left: 1px solid #333; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 10px; line-height: 1.4; margin: 5px 0; white-space: pre-wrap; font-size: 0.95rem; }
        .bot { background: #202c33; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #333; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 0; color: white; }
        #input-area { padding: 20px; background: #202c33; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none; }
        button { background: var(--accent); border: none; padding: 10px 25px; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }
        .session-data { background: #000; padding: 10px; border-radius: 8px; font-family: monospace; color: #0f0; margin-bottom: 20px; font-size: 0.75rem; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div style="padding: 15px; background: #202c33; font-weight: bold; border-bottom: 1px solid #333;">🐼 Pandda Atendimento V8</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="userInput" placeholder="Responda aqui..." onkeypress="handleKeyPress(event)" autofocus>
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <div id="admin-panel">
        <h2>Sessão Supabase</h2>
        <div id="sessionView" class="session-data">{}</div>
        <h2>Logs</h2>
        <div id="logs" style="font-size: 0.8rem; font-family: monospace; color: #888;"></div>
    </div>

<script>
    let session = { step: 'START', name: '', email: '', indicacao: '', horario: '', test_mode: '' };

    function botReply(text) {
        setTimeout(() => {
            const div = document.createElement('div');
            div.className = 'msg bot'; div.innerHTML = text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            document.getElementById('sessionView').innerText = JSON.stringify(session, null, 2);
        }, 400);
    }

    function showMainMenu(txt = "") {
        session.step = 'MENU_PRINCIPAL';
        botReply(`${txt ? txt + "\n\n" : ""}Olá! Como podemos te ajudar hoje? 🐼\n\n1️⃣ Como funciona?\n2️⃣ Planos e Valores\n3️⃣ Teste Gratuito`);
    }

    function handleUserInput(input) {
        const msg = input.toLowerCase().trim();
        if (msg === '0') { showMainMenu("Voltamos ao menu!"); return; }

        switch (session.step) {
            case 'START': showMainMenu(); break;

            case 'MENU_PRINCIPAL':
                if (msg === '3') {
                    session.step = 'BOAS_VINDAS_TESTE';
                    botReply(`**Teste Gratuito Pandda** 🚀\n\nAntes de solicitar, tire suas dúvidas sobre dispositivos e instalação aqui:\n📖 https://pandda.vip/guia\n\n⚠️ **Importante:**\n1. O teste dura 2h após o envio dos dados.\n2. Tenha o app instalado antes de prosseguir.\n\nComo deseja continuar?\n\n1️⃣ Tenho um **Código de Indicação**\n2️⃣ Não tenho código / Continuar sem\n0️⃣ Voltar ao menu`);
                } 
                else if (msg === '1') botReply("DualAPP: 2 aplicativos para você nunca ficar sem sinal! Digite 0 para voltar.");
                else if (msg === '2') botReply("Plano DualAPP: R$ 34,90. Digite 0 para voltar.");
                break;

            case 'BOAS_VINDAS_TESTE':
                if (msg === '1') {
                    session.step = 'COLETA_INDICACAO';
                    botReply(`Perfeito! Digite o seu **CÓDIGO DE INDICAÇÃO**:`);
                } else if (msg === '2') {
                    session.indicacao = 'Nenhuma';
                    session.step = 'ESCOLHA_TESTE';
                    botReply(`Sem problemas! Vamos prosseguir.\n\nComo deseja seu teste?\n1️⃣ Quero agora (Até as 18h)\n2️⃣ Agendar horário`);
                } else {
                    botReply("Escolha 1 para usar código ou 2 para continuar sem.");
                }
                break;

            case 'COLETA_INDICACAO':
                // Simulação de consulta ao banco
                const codigos = ["PANDDA10", "VIP"];
                if (codigos.includes(input.toUpperCase())) {
                    session.indicacao = input.toUpperCase();
                    botReply(`✅ **Código Válido!** Você terá 6h de teste.\n\nComo deseja receber?\n1️⃣ Agora\n2️⃣ Agendar`);
                    session.step = 'ESCOLHA_TESTE';
                } else {
                    botReply(`❌ Código não encontrado. Tente novamente ou digite **2** para continuar sem código.`);
                }
                break;

            case 'ESCOLHA_TESTE':
                if (msg === '1') {
                    const h = new Date().getHours();
                    if (h >= 9 && h < 18) {
                        session.horario = "Imediato"; session.step = 'COLETA_NOME';
                        botReply(`Ótimo! Qual seu **nome**?`);
                    } else {
                        botReply(`Suporte offline (9h-18h). Digite **2** para agendar ou **0** para o menu.`);
                    }
                } else if (msg === '2') {
                    session.step = 'COLETA_HORARIO';
                    botReply(`Escolha uma hora entre **9** e **18** (apenas o número):`);
                }
                break;

            case 'COLETA_HORARIO':
                const hSol = parseInt(msg);
                if (!isNaN(hSol) && hSol >= 9 && hSol <= 18) {
                    session.horario = hSol + ":00h"; session.step = 'COLETA_NOME';
                    botReply(`Agendado para às ${session.horario}. Qual seu **nome**?`);
                } else { botReply(`⚠️ Digite apenas o número (9 a 18).`); }
                break;

            case 'COLETA_NOME':
                session.name = input; session.step = 'COLETA_EMAIL';
                botReply(`Prazer, ${session.name}! Qual seu **e-mail**?`);
                break;

            case 'COLETA_EMAIL':
                session.email = input; session.step = 'CONFIRMACAO';
                botReply(`**CONFIRMAÇÃO DO TESTE** 🐼\n\n- Início: ${session.horario}\n- Nome: ${session.name}\n- E-mail: ${session.email}\n- Indicação: ${session.indicacao}\n\n1️⃣ Confirmar e enviar\n2️⃣ Corrigir`);
                break;

            case 'CONFIRMACAO':
                if (msg === '1') {
                    botReply(`**Sucesso!** 🚀 Seus dados foram salvos. Aguarde nosso contato.\n\nDigite **0** para o menu.`);
                    session.step = 'START';
                } else {
                    session.step = 'BOAS_VINDAS_TESTE';
                    botReply("Recomeçando... Deseja usar código de indicação?");
                }
                break;
        }
    }

    function sendMessage() {
        const i = document.getElementById('userInput');
        if (i.value.trim() === "") return;
        const d = document.createElement('div'); d.className = 'msg user'; d.innerText = i.value;
        document.getElementById('messages').appendChild(d);
        handleUserInput(i.value); i.value = "";
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    botReply("Olá! Digite 'Oi' para iniciar.");
</script>
</body>
</html>
