<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Bot V4 - Fluxo de Teste Pro</title>
    <style>
        :root { --whatsapp-green: #25D366; --bg-dark: #121b22; --panel-bg: #1f2c33; --text-light: #e9edef; --accent: #00a884; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-dark); color: var(--text-light); }
        #chat-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        #admin-panel { width: 350px; background: var(--panel-bg); padding: 20px; overflow-y: auto; border-left: 1px solid #333; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 10px; line-height: 1.4; margin: 5px 0; white-space: pre-wrap; font-size: 0.95rem; }
        .bot { background: #202c33; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #333; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 0; color: white; }
        #input-area { padding: 20px; background: #202c33; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none; }
        button { background: var(--accent); border: none; padding: 10px 25px; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }
        .session-data { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; color: #0f0; margin-bottom: 20px; font-size: 0.8rem; }
        h2 { color: var(--whatsapp-green); font-size: 1rem; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div style="padding: 15px; background: #202c33; font-weight: bold; border-bottom: 1px solid #333;">🐼 Pandda Atendimento</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="userInput" placeholder="Responda aqui..." onkeypress="handleKeyPress(event)" autofocus>
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <div id="admin-panel">
        <h2>Sessão Supabase</h2>
        <div id="sessionView" class="session-data">{}</div>
        <h2>Logs</h2>
        <div id="logs" style="font-size: 0.8rem; color: #888; font-family: monospace;"></div>
    </div>

<script>
    let session = {
        step: 'START',
        name: '',
        email: '',
        indicacao: '',
        horario: '',
        is_agendado: false
    };

    function botReply(text) {
        setTimeout(() => {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            document.getElementById('sessionView').innerText = JSON.stringify(session, null, 2);
        }, 400);
    }

    function showMainMenu(txt = "") {
        session.step = 'MENU_PRINCIPAL';
        const h = new Date().getHours();
        const saudacao = (h < 12) ? "Bom dia" : (h < 18) ? "Boa tarde" : "Boa noite";
        botReply(`${txt ? txt + "\n\n" : ""}${saudacao}! 🐼\n\n1️⃣ Como funciona?\n2️⃣ Planos e Valores\n3️⃣ Teste Gratuito\n0️⃣ Menu Principal`);
    }

    function handleUserInput(input) {
        const msg = input.toLowerCase().trim();
        const logs = document.getElementById('logs');
        logs.innerHTML = `<div>[${session.step}] -> ${msg}</div>` + logs.innerHTML;

        if (msg === '0') { showMainMenu(); return; }

        switch (session.step) {
            case 'START':
                showMainMenu();
                break;

            case 'MENU_PRINCIPAL':
                if (msg === '3') {
                    session.step = 'COLETA_INDICACAO';
                    botReply(`Antes de começarmos seu teste... 🚀\n\nVocê possui algum **CÓDIGO DE INDICAÇÃO**?\n\n*(Se sim, digite o código. Se não tiver, digite **NAO**)*`);
                } else if (msg === '2') {
                    botReply("Planos: R$ 34,90 (DualAPP). Digite 0 para voltar.");
                } else {
                    botReply("Escolha uma opção válida ou digite 0.");
                }
                break;

            case 'COLETA_INDICACAO':
                session.indicacao = (msg === 'nao') ? 'Nenhum' : input;
                session.step = 'TESTE_TIPO';
                botReply(`Anotado! 📝\n\nComo deseja seu teste?\n\n1️⃣ Quero agora (Disponível até as 18h)\n2️⃣ Quero agendar horário`);
                break;

            case 'TESTE_TIPO':
                if (msg === '1') {
                    const horaAtual = new Date().getHours();
                    if (horaAtual >= 9 && horaAtual < 18) {
                        session.is_agendado = false;
                        session.horario = "Imediato";
                        session.step = 'COLETA_NOME';
                        botReply(`Perfeito! Vamos gerar agora. Qual seu **nome**?`);
                    } else {
                        botReply(`No momento estamos fora do horário de suporte (09h às 18h). Digite **2** para agendar para amanhã!`);
                    }
                } else if (msg === '2') {
                    session.is_agendado = true;
                    session.step = 'COLETA_HORARIO';
                    botReply(`Ótimo! Em qual horário você deseja o teste?\n\nEscolha entre **9** e **18**.\n\n*(Digite apenas o número da hora, ex: 14)*`);
                }
                break;

            case 'COLETA_HORARIO':
                const horaSol = parseInt(msg);
                if (!isNaN(horaSol) && horaSol >= 9 && horaSol <= 18) {
                    session.horario = horaSol + ":00h";
                    session.step = 'COLETA_NOME';
                    botReply(`Agendado para às ${session.horario}! ✅\n\nAgora, me diga seu **nome**:`);
                } else {
                    botReply(`⚠️ Horário inválido! Por favor, digite um número entre **9** e **18**.`);
                }
                break;

            case 'COLETA_NOME':
                session.name = input;
                session.step = 'COLETA_EMAIL';
                botReply(`Prazer, ${session.name}! Qual seu **e-mail**?`);
                break;

            case 'COLETA_EMAIL':
                session.email = input;
                session.step = 'CONFIRMACAO';
                const resumo = `DADOS DO TESTE 🐼\n\n` +
                               `- Indicação: ${session.indicacao}\n` +
                               `- Horário: ${session.horario}\n` +
                               `- Nome: ${session.name}\n` +
                               `- E-mail: ${session.email}\n\n` +
                               `1️⃣ Confirmar e enviar\n2️⃣ Alterar dados`;
                botReply(resumo);
                break;

            case 'CONFIRMACAO':
                if (msg === '1') {
                    botReply(`Prontinho! Seus dados foram enviados. Se for agendado, entraremos em contato no horário solicitado. Se for imediato, verifique seu WhatsApp em instantes! 🚀`);
                    session.step = 'MENU_PRINCIPAL';
                } else {
                    session.step = 'COLETA_INDICACAO';
                    botReply("Vamos recomeçar. Qual seu código de indicação? (ou digite NAO)");
                }
                break;
        }
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        if (input.value.trim() === "") return;
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerText = input.value;
        document.getElementById('messages').appendChild(div);
        handleUserInput(input.value);
        input.value = "";
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    botReply("Olá! Digite 'Oi' para começar o teste do Pandda.");
</script>
</body>
</html>
