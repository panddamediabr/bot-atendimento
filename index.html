<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Bot Engine 🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="mobile-toggle" onclick="toggleConfig()">⚙️</button>

    <div class="app-container" id="appContainer">
        
        <aside class="settings-panel">
            <h2>⚙️ Pandda Config</h2>
            
            <div class="time-box">
                <label class="time-label">⏰ Horário Simulado</label>
                <input type="time" id="simulatedTime" value="09:00" onchange="updatePhoneClock()">
                <div class="hint-text">
                    Define se o bot diz Bom dia/Tarde/Noite e se libera testes.
                </div>
            </div>

            <div class="form-group">
                <label>Expediente Teste (Início/Fim)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="time" id="workStart" value="09:00">
                    <input type="time" id="workEnd" value="20:00">
                </div>
            </div>

            <div class="form-group">
                <label>Códigos Válidos (CSV)</label>
                <input type="text" id="validCodes" value="PANDDA10, VIP2024, TESTE">
            </div>

            <div class="form-group">
                <label>Velocidade (ms/char)</label>
                <input type="number" id="msPerChar" value="45">
            </div>
            
            <button class="btn-action" onclick="restartChat()">🔄 Nova Sessão (Reset)</button>
            <button class="btn-action btn-secondary" onclick="clearLogs()">🗑️ Limpar Logs</button>

            <div class="status-box">
                <div>ESTADO: <span id="displayState" class="highlight">START</span></div>
                <div>SESSION: <span id="displaySession">...</span></div>
                <div>1º CONTATO: <span id="displayFirstContact" class="highlight-bool">true</span></div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="phone-mockup">
                <div class="chat-header">
                    <div class="header-info">
                        <div class="profile-pic">🐼</div>
                        <div>
                            <div style="font-weight: 500;">Pandda Bot</div>
                            <div style="font-size: 0.75rem; opacity: 0.8;">Online</div>
                        </div>
                    </div>
                    <div id="phoneClock" style="font-size: 0.8rem; font-weight: bold; opacity: 0.8;">09:00</div>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Digite uma mensagem..." onkeypress="handleEnter(event)">
                    <button onclick="sendUserMessage()" class="send-btn">➤</button>
                </div>
            </div>
        </main>

        <aside class="logs-panel" id="logsPanel">
            </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
