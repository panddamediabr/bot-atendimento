<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pandda - Agendamento Inteligente V5 (Full Merge)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; opacity: 0.1; position: absolute; top:0; left:0; right:0; bottom:0; z-index: 0; }
        .message-in { background-color: #202c33; border-radius: 0 10px 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 85%; position: relative; z-index: 10; font-size: 14px; word-wrap: break-word; }
        .message-out { background-color: #005c4b; border-radius: 10px 0 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 85%; margin-left: auto; position: relative; z-index: 10; font-size: 14px; word-wrap: break-word; }
        .json-view { font-family: 'Courier New', Courier, monospace; font-size: 11px; line-height: 1.4; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111b21; }
        ::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row">

    <div class="flex-1 md:w-1/3 flex flex-col border-r border-gray-700 relative bg-[#0b141a] min-h-0">
        <div class="chat-bg pointer-events-none"></div>
        
        <div class="bg-[#202c33] p-3 flex items-center justify-between z-20 shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white font-bold shrink-0">P</div>
                <div class="overflow-hidden">
                    <h3 class="font-semibold text-gray-100 truncate">Pandda Assistant</h3>
                    <p class="text-xs text-green-400">● V5 Anti-Ban & Scheduler</p>
                </div>
            </div>
            <div class="flex flex-col items-end shrink-0">
                <label class="text-[10px] text-gray-400">Hora Simulada:</label>
                <input type="number" id="simulatedHour" class="bg-gray-700 text-white text-xs p-1 rounded w-14 text-center" min="0" max="23" value="14">
            </div>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 z-10 flex flex-col scroll-smooth"></div>

        <div class="bg-[#202c33] p-2 md:p-3 flex gap-2 z-20 shrink-0 pb-safe"> 
            <input type="text" id="userInput" class="flex-1 bg-[#2a3942] rounded-lg px-4 py-3 text-white outline-none focus:ring-1 focus:ring-green-500 text-sm md:text-base" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-[#00a884] w-12 h-12 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-[#008f6f] transition shrink-0"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="md:w-2/3 bg-[#0b141a] flex flex-col border-t md:border-t-0 md:border-l border-gray-700 transition-all duration-300 shrink-0" id="dashboardPanel">
        <div onclick="toggleDashboard()" class="p-3 bg-[#1f2937] flex justify-between items-center cursor-pointer border-b border-gray-700 shrink-0">
            <h2 class="text-sm md:text-xl font-bold text-green-400 flex items-center"><i class="fas fa-terminal mr-2"></i>Console do Sistema</h2>
            <div class="flex gap-2">
                <button onclick="resetSystem(); event.stopPropagation();" class="text-[10px] bg-red-600 px-2 py-1 rounded hover:bg-red-700">Reiniciar</button>
                <i id="toggleIcon" class="fas fa-chevron-up md:hidden text-gray-400"></i>
            </div>
        </div>

        <div id="dashboardContent" class="grid md:grid-cols-2 grid-rows-2 gap-4 p-4 h-full overflow-y-auto">
            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg col-span-2 h-40">
                <h3 class="text-yellow-400 font-bold mb-2 text-xs uppercase flex justify-between">
                    <span><i class="fas fa-shield-virus mr-2"></i>Log Anti-Ban (Sorteio de Sinônimos)</span>
                </h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-yellow-100" id="textEngineLog"></div>
            </div>

            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg h-56 md:h-auto">
                <h3 class="text-blue-400 font-bold mb-2 text-xs uppercase"><i class="fas fa-memory mr-2"></i>Estado da Sessão</h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-blue-200" id="supabaseView"></div>
            </div>

            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg h-56 md:h-auto">
                <h3 class="text-green-400 font-bold mb-2 text-xs uppercase"><i class="fas fa-database mr-2"></i>Logs (DB/Discord)</h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-gray-300" id="logsView"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ANTI-BAN ---
        const SYNONYMS = {
            "{saudacao_dia}": ["Bom dia", "Ótimo dia", "Olá, bom dia"],
            "{saudacao_tarde}": ["Boa tarde", "Uma ótima tarde", "Olá, boa tarde"],
            "{saudacao_noite}": ["Boa noite", "Excelente noite", "Olá, boa noite"],
            "{emoji_feliz}": ["🐼", "✅", "🤝", "👍"],
            "{nome_bot}": ["Assistente Pandda", "Suporte Virtual", "Sistema Pandda"],
            "{menu_intro}": ["Escolha uma opção:", "Como posso ajudar hoje?", "Selecione uma opção:"]
        };

        const TEXT_VARIANTS = {
            "GREETING": ["Oi, {saudacao}. Sou seu {nome_bot}. Como posso ajudar?", "Olá! Aqui é o {nome_bot}. {saudacao}!"],
            "MENU_MAIN": ["{menu_intro}\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente"],
            "HOW_IT_WORKS": ["ℹ️ *Como Funciona:*\nO Pandda roda em TV, Celular ou TV Box.\n💰 Valor: R$ 34,90 (Mensal).\n✅ Não é assinatura! Pague apenas quando quiser."],
            "PLAN_INFO": ["*Planos Pandda:*\n\n🔹 1 Tela: R$ 34,90\n🔹 Tela Adicional: R$ 17,90\n\nQualidade máxima garantida!"],
            "TEST_INTRO": ["Para testar é simples! Baixe o app em pandda.vip/guia. O teste dura 6h."],
            "ERROR_DEFAULT": ["⚠️ Opção inválida. Digite o número correspondente."]
        };

        const FAQ_ITEMS = [
            "📱 *Celular:* Temos app próprio Android.",
            "📺 *Dispositivos:* Smart TVs, Box e Chromecast.",
            "🎬 *Conteúdo:* Grade completa de canais e filmes.",
            "💸 *Pagamento:* Pré-pago via PIX."
        ];

        function getDynamicText(key) {
            const templates = TEXT_VARIANTS[key] || TEXT_VARIANTS["ERROR_DEFAULT"];
            let template = templates[Math.floor(Math.random() * templates.length)];
            const original = template;

            const hour = parseInt(document.getElementById('simulatedHour').value);
            let timeKey = hour < 12 ? "{saudacao_dia}" : (hour < 18 ? "{saudacao_tarde}" : "{saudacao_noite}");
            
            template = template.replace("{saudacao}", getRandomSynonym(timeKey));
            template = template.replace(/{(\w+)}/g, (match) => getRandomSynonym(match) || match);

            // LOG DO ANTI-BAN
            const logDiv = document.getElementById('textEngineLog');
            logDiv.innerHTML = `<div class="mb-1 border-b border-gray-800 pb-1 text-[10px]"><span class="text-blue-400">[${key}]</span> <span class="text-gray-500">"${original.substring(0,20)}..."</span> → <span class="text-yellow-400">"${template}"</span></div>` + logDiv.innerHTML;
            
            return template;
        }

        function getRandomSynonym(key) {
            const list = SYNONYMS[key];
            return list ? list[Math.floor(Math.random() * list.length)] : key;
        }

        function getFaqText() {
            let items = [...FAQ_ITEMS].sort(() => Math.random() - 0.5);
            return `❓ *Dúvidas Frequentes*\n\n` + items.join("\n\n") + `\n\n0️⃣ Voltar`;
        }

        // --- LÓGICA DO BOT ---
        const CONFIG = { prices: { base: 34.90, extra: 17.90 }, hours: { open: 9, close: 20 } };
        let session = { status: "IDLE", flow_step: "", temp_data: {} };

        function processBotLogic(input) {
            const currentHour = parseInt(document.getElementById('simulatedHour').value);
            const cleanInput = input.trim();
            updateSupabaseView();

            if (cleanInput === "0" && session.status !== "IDLE") {
                session.status = "MENU"; session.flow_step = "";
                botReply("❌ Cancelado.");
                setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 1000);
                return;
            }

            if (session.status === "IDLE") {
                botReply(getDynamicText("GREETING"));
                setTimeout(() => { botReply(getDynamicText("MENU_MAIN")); session.status = "MENU"; }, 1000);
                return;
            }

            switch (session.status) {
                case "MENU": handleMenu(cleanInput); break;
                case "BUY_FLOW": handleBuyFlow(cleanInput); break;
                case "TEST_FLOW": handleTestFlow(cleanInput, currentHour); break;
            }
        }

        function handleMenu(input) {
            if (input === "1") { botReply(getDynamicText("HOW_IT_WORKS")); setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 3000); }
            else if (input === "2") { botReply(getDynamicText("PLAN_INFO")); setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 3000); }
            else if (input === "3") { session.status = "BUY_FLOW"; session.flow_step = "SELECT_PLAN"; botReply("1️⃣ Plano Base (1 Tela)\n2️⃣ Com telas extras\n0️⃣ Voltar"); }
            else if (input === "4") { startTestFlow(); }
            else if (input === "5") { botReply(getFaqText()); }
            else if (input === "6") { botReply("Chamando atendente..."); addLog("DISCORD", "🔔 Suporte solicitado!"); }
            else { botReply(getDynamicText("ERROR_DEFAULT")); }
        }

        function handleBuyFlow(input) {
            if (session.flow_step === "SELECT_PLAN") {
                if (input === "1") generateCheckout(1);
                else if (input === "2") { session.flow_step = "SELECT_SCREENS"; botReply("Quantas telas no total? (2 ou 3)"); }
            } else if (session.flow_step === "SELECT_SCREENS") {
                if (["2", "3"].includes(input)) generateCheckout(parseInt(input));
            }
        }

        function generateCheckout(screens) {
            const total = CONFIG.prices.base + (CONFIG.prices.extra * (screens - 1));
            botReply(`Link de pagamento para ${screens} telas (R$ ${total.toFixed(2)}): pagar.pandda.vip/${Math.random().toString(36).substring(7)}`);
            session.status = "IDLE";
            setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 4000);
        }

        // --- FLUXO DE TESTE E AGENDAMENTO ---
        function startTestFlow() {
            session.status = "TEST_FLOW";
            session.flow_step = "ASK_CODE";
            botReply(getDynamicText("TEST_INTRO"));
            setTimeout(() => botReply("Possui código de indicação? (Digite o código ou 'não')"), 1000);
        }

        function handleTestFlow(input, currentHour) {
            if (session.flow_step === "ASK_CODE") {
                session.temp_data.referral = input;
                session.flow_step = "SCHEDULE_TIME";
                showAvailableHours(currentHour);
                return;
            }

            if (session.flow_step === "SCHEDULE_TIME") {
                const match = input.match(/^(\d+)/);
                if (!match) { botReply("⚠️ Digite a hora (ex: 15)."); return; }
                
                let selected = parseInt(match[0]);
                let isTomorrow = currentHour >= 20;

                // VALIDAÇÃO DE HORA PASSADA
                if (!isTomorrow && selected <= currentHour) {
                    botReply(`⚠️ Esse horário (${selected}h) já passou hoje. Escolha a partir das ${currentHour + 1}h.`);
                    return;
                }

                if (selected < 9 || selected > 20) { botReply("⚠️ Atendimento das 09h às 20h."); return; }

                session.temp_data.hora = selected + "h";
                session.temp_data.dia = isTomorrow ? "Amanhã" : "Hoje";
                session.flow_step = "ASK_NAME";
                botReply(`Agendado para **${session.temp_data.dia}** às ${selected}h. Qual seu nome?`);
                return;
            }

            if (session.flow_step === "ASK_NAME") {
                session.temp_data.name = input;
                session.flow_step = "CONFIRMATION";
                const resumo = `👤 Nome: ${session.temp_data.name}\n📅 Data: ${session.temp_data.dia}\n🕒 Hora: ${session.temp_data.hora}`;
                botReply(`📝 *Confirme os dados para o teste:*\n\n${resumo}\n\n1️⃣ Confirmar\n2️⃣ Mudar Nome\n3️⃣ Mudar Hora\n0️⃣ Cancelar`);
                return;
            }

            if (session.flow_step === "CONFIRMATION" && input === "1") {
                botReply(`✅ Agendado, ${session.temp_data.name}!`);
                addLog("SUPABASE", `INSERT INTO leads (name, day, hour) VALUES ('${session.temp_data.name}', '${session.temp_data.dia}', '${session.temp_data.hora}')`);
                session.status = "IDLE";
                setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 2000);
            }
        }

        function showAvailableHours(currentHour) {
            let isTomorrow = currentHour >= 20;
            let msg = isTomorrow ? "⚠️ Hoje não há mais vagas. Vagas para **AMANHÃ**:\n" : "🕒 Vagas para **HOJE**:\n";
            let slots = [];
            let start = isTomorrow ? 9 : Math.max(9, currentHour + 1);
            for (let i = start; i <= 20; i++) slots.push(i + "h");
            botReply(msg + slots.join(", ") + "\n\nQual horário prefere?");
        }

        // --- SISTEMA ---
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value; if (!text) return;
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-out text-white';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(() => processBotLogic(text), 600);
        }

        function botReply(text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-in text-white';
            msgDiv.innerHTML = text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addLog(type, message) {
            const view = document.getElementById('logsView');
            view.innerHTML = `<div class="mb-1 border-b border-gray-800 pb-1 text-[10px]"><span class="text-green-400 font-bold">${type}</span>: ${message}</div>` + view.innerHTML;
        }

        function updateSupabaseView() { document.getElementById('supabaseView').innerText = JSON.stringify(session, null, 4); }
        function toggleDashboard() { document.getElementById('dashboardContent').classList.toggle('hidden'); }
        function resetSystem() { location.reload(); }

        botReply("Sistema V5 Consolidado Pronto. Digite 'oi'.");
    </script>
</body>
</html>
