<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandda Engine Pro 🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- VARIAVEIS GERAIS --- */
        :root {
            --primary: #00a884;
            --bg-chat: #e5ddd5;
            --dark-panel: #202c33;
            --log-bg: #1e1e1e; /* VS Code Dark Style */
            --log-text: #d4d4d4;
            --key-color: #9cdcfe;
            --string-color: #ce9178;
            --bool-color: #569cd6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; height: 100vh; overflow: hidden; background-color: #f0f2f5; }

        /* --- LAYOUT GRID (Logs Aumentados) --- */
        .app-container {
            display: grid;
            grid-template-columns: 260px 1fr 480px; /* <--- LOGS MAIS LARGOS AQUI */
            width: 100%; height: 100%;
        }

        /* --- 1. PAINEL ESQUERDO (CONFIG) --- */
        .settings-panel {
            background-color: var(--dark-panel); color: #d1d7db;
            padding: 20px; border-right: 1px solid #333; overflow-y: auto;
        }
        .settings-panel h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #8696a0; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #2a3942; border: none; color: #fff; border-radius: 6px;
        }
        .btn-action {
            width: 100%; padding: 12px; margin-top: 10px; background: var(--primary);
            color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .status-box {
            margin-top: 30px; padding: 10px; background: #111b21; border-radius: 6px; font-family: monospace; font-size: 0.8rem;
        }

        /* --- 2. PAINEL CENTRAL (CHAT) --- */
        .chat-area {
            background-color: #d1d7db;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .phone-mockup {
            width: 100%; max-width: 500px; height: 100%; max-height: 95vh;
            background-color: var(--bg-chat); display: flex; flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
        }
        .chat-header {
            background-color: var(--dark-panel); color: white; padding: 10px 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .message {
            max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4;
            position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .bot { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
        .user { background-color: var(--primary); color: white; align-self: flex-end; border-top-right-radius: 0; }
        .chat-input-area {
            background: var(--dark-panel); padding: 10px; display: flex; gap: 10px;
        }
        .chat-input-area input {
            flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none;
        }
        .typing-indicator {
            font-size: 0.75rem; color: #00a884; font-weight: bold; padding-left: 20px; margin-bottom: 5px; display: none;
        }

        /* --- 3. PAINEL DIREITO (LOGS PRO) --- */
        .logs-panel {
            background-color: var(--log-bg); 
            color: var(--log-text);
            padding: 10px; 
            font-family: 'Fira Code', 'Courier New', monospace; /* Fonte Monospaced Melhor */
            overflow-y: auto; 
            border-left: 1px solid #333;
            font-size: 0.85rem;
        }
        .log-entry {
            background: #252526;
            margin-bottom: 8px; 
            border-left: 3px solid transparent; 
            padding: 8px;
            border-radius: 4px;
        }
        
        /* Cores da Borda Lateral por Tipo */
        .border-ENGINE { border-left-color: #ffd700; }
        .border-SUPABASE { border-left-color: #007acc; }
        .border-DISCORD { border-left-color: #5865F2; }
        .border-SYSTEM { border-left-color: #666; }

        .log-header { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px;
        }
        .log-tag { 
            font-weight: 600; font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; color: #000; letter-spacing: 0.5px;
        }
        /* Cores das Labels */
        .tag-ENGINE { background: #ffd700; color: #000; }
        .tag-SUPABASE { background: #007acc; color: #fff; }
        .tag-DISCORD { background: #5865F2; color: #fff; }
        .tag-SYSTEM { background: #444; color: #ccc; }

        /* JSON Beautifier */
        .log-data { display: block; white-space: pre-wrap; word-break: break-all; margin-top: 5px; line-height: 1.4; }
        .json-key { color: var(--key-color); }
        .json-string { color: var(--string-color); }
        .json-bool { color: var(--bool-color); font-weight: bold; }
        .json-null { color: #569cd6; font-style: italic; }

        /* --- RESPONSIVIDADE MOBILE --- */
        .mobile-toggle { display: none; position: fixed; top: 10px; right: 10px; z-index: 1000; background: var(--primary); color: white; border: none; padding: 8px; border-radius: 50%; }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 0px 1fr 0px; } 
            .settings-panel, .logs-panel { display: none; position: absolute; z-index: 100; width: 90%; height: 100%; top: 0; }
            .settings-panel { left: 0; }
            .logs-panel { right: 0; width: 100%; font-size: 0.8rem; } /* Logs ocupam tela toda no mobile se ativados */
            
            .app-container.show-config .settings-panel { display: block; }
            .app-container.show-logs .logs-panel { display: block; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

    <button class="mobile-toggle" onclick="toggleConfig()">⚙️</button>

    <div class="app-container" id="appContainer">
        
        <aside class="settings-panel">
            <h2>⚙️ Pandda Config</h2>
            <div class="form-group">
                <label>Status Admin</label>
                <select id="sysStatus"><option>Online</option><option>Manutenção</option></select>
            </div>
            <div class="form-group">
                <label>Horário Teste (Início/Fim)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="time" id="hStart" value="09:00">
                    <input type="time" id="hEnd" value="20:00">
                </div>
            </div>
            <div class="form-group">
                <label>Códigos Válidos (CSV)</label>
                <input type="text" id="validCodes" value="PANDDA10, VIP2024, TESTE">
            </div>
            
            <button class="btn-action" onclick="restartChat()">🔄 Reset Chat</button>
            <button class="btn-action" style="background: #333; margin-top: 5px;" onclick="clearLogs()">🗑️ Limpar Logs</button>

            <div class="status-box">
                <div>ESTADO: <span id="displayState" style="color: #00a884">INICIO</span></div>
                <div>SESSION: <span id="displaySession">...</span></div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="phone-mockup">
                <div class="chat-header">
                    <div style="width: 35px; height: 35px; background: rgba(255,255,255,0.2); border-radius: 50%; display: grid; place-items: center;">🐼</div>
                    <div>
                        <div style="font-weight: 500;">Pandda Bot</div>
                        <div style="font-size: 0.75rem; opacity: 0.8;">Online</div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                <div class="typing-indicator" id="typingIndicator">digitando...</div>

                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                    <button onclick="sendUserMessage()" style="background:none; border:none; font-size: 1.2rem; cursor: pointer;">➤</button>
                </div>
            </div>
        </main>

        <aside class="logs-panel" id="logsPanel">
            </aside>

    </div>

    <script>
        /* =================================================================
           SISTEMA DE LOGS AVANÇADO (Visual VS Code)
           ================================================================= */
        
        function formatJSON(obj) {
            // Transforma objeto JS em HTML colorido
            let json = JSON.stringify(obj, null, 2);
            
            // Regex para colorir
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key'; // Chave
                    } else {
                        cls = 'json-string'; // Valor String
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-bool'; // Booleano
                } else if (/null/.test(match)) {
                    cls = 'json-null'; // Null
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function logger(type, title, data) {
            const panel = document.getElementById('logsPanel');
            const time = new Date().toLocaleTimeString('pt-BR');
            
            let formattedData = '';
            if (typeof data === 'object' && data !== null) {
                formattedData = `<div class="log-data">${formatJSON(data)}</div>`;
            } else {
                formattedData = `<div class="log-data" style="color: #fff">${data}</div>`;
            }

            const html = `
                <div class="log-entry border-${type}">
                    <div class="log-header">
                        <div>
                            <span class="log-tag tag-${type}">${type}</span>
                            <span style="font-weight:bold; color:#fff; margin-left:8px;">${title}</span>
                        </div>
                        <span style="font-size: 0.65rem; color: #666;">${time}</span>
                    </div>
                    ${formattedData}
                </div>
            `;
            
            panel.insertAdjacentHTML('afterbegin', html);
        }

        /* =================================================================
           ENGINE CORE
           ================================================================= */
        const Session = { id: 'SES-' + Math.floor(Math.random()*1000), state: 'START', data: {} };

        function updateStatusUI() {
            document.getElementById('displayState').innerText = Session.state;
            document.getElementById('displaySession').innerText = Session.id;
        }

        function processSpintax(text) {
            const processed = text.replace(/\{([^{}]+)\}/g, (match, group) => {
                const options = group.split('|');
                return options[Math.floor(Math.random() * options.length)];
            });

            // LOG DE SPINTAX (Destacado)
            if (text.includes('{')) {
                logger('ENGINE', 'Spintax Generation', {
                    Template: text,
                    Result: processed
                });
            }
            return processed;
        }

        function shuffleMessages(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            logger('ENGINE', 'Shuffle Order', { 
                original_count: array.length, 
                status: 'Randomized Sequence'
            });
            return arr;
        }

        /* =================================================================
           FLUXOS (MODULAR)
           ================================================================= */
        
        // --- DB MOCK (Simulação Supabase) ---
        const DB = {
            checkCode: (code) => {
                const list = document.getElementById('validCodes').value.toUpperCase().split(',').map(c => c.trim());
                const isValid = list.includes(code.toUpperCase());
                
                // LOG EXPLICITO DE DB
                logger('SUPABASE', 'Query: public.codigos', {
                    query_type: 'SELECT',
                    input_code: code,
                    found: isValid,
                    latency: '12ms'
                });
                return isValid;
            },
            saveSession: (sessionData) => {
                logger('SUPABASE', 'Upsert: public.sessao', {
                    id: sessionData.id,
                    state: sessionData.state,
                    payload: sessionData.data
                });
            }
        };

        // --- FLUXOS ---
        
        const FlowMenu = {
            getGreeting: () => {
                return ["{Olá|Oi|E aí}, {tudo bem|como vai}? 🐼", "1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assinar\n4️⃣ Testar\n5️⃣ Dúvidas"];
            },
            handle: (opt) => {
                if(opt==='1') return FlowHowItWorks.start();
                if(opt==='2') return FlowPlans.start();
                if(opt==='3') return FlowSigning.start();
                if(opt==='4') return FlowTesting.start();
                if(opt==='5') return FlowFAQ.start();
                return { text: ["Opção inválida. Tente 1 a 5."], newState: 'MENU' };
            }
        };

        const FlowHowItWorks = {
            msgs: [
                "Funciona 100% via {internet|web} 🌐",
                "Sem {cabos|antenas} ou instalação física.",
                "Compatível com Smart TV, TV Box e Celular 📱",
                "Sistema **DualAPP**: 2 apps para {maior estabilidade|não travar} 🚀"
            ],
            start: () => {
                const shuffled = shuffleMessages(FlowHowItWorks.msgs).map(t => processSpintax(t));
                return { text: ["Confira como funciona:", ...shuffled, "Digite 0 para voltar."], newState: 'MENU' };
            }
        };

        const FlowPlans = {
            start: () => ({ text: ["1️⃣ Base: R$34,90\n2️⃣ Dual: R$52,80\n3️⃣ Família: R$70,70\n\nDigite 3 para Assinar."], newState: 'MENU' })
        };

        const FlowSigning = {
            start: () => ({ text: ["Qual plano? (1, 2 ou 3)"], newState: 'SIGN_PLAN' }),
            handle: (inp, state) => {
                if(state === 'SIGN_PLAN') {
                    Session.data.plan = inp;
                    return { text: ["Tem código de indicação? Digite ou escreva **Não**."], newState: 'SIGN_CODE' };
                }
                if(state === 'SIGN_CODE') {
                    if(['nao','não','n'].includes(inp.toLowerCase())) {
                        Session.data.code = null;
                        return { text: ["Sem código. Adulto? (Sim/Não)"], newState: 'SIGN_ADULT' };
                    }
                    if(DB.checkCode(inp)) {
                        Session.data.code = inp;
                        return { text: ["Código Válido! ✅ Adulto? (Sim/Não)"], newState: 'SIGN_ADULT' };
                    }
                    return { text: ["Inválido ❌. Tente novamente ou digite Não."], newState: 'SIGN_CODE' };
                }
                if(state === 'SIGN_ADULT') {
                    Session.data.adult = inp;
                    const url = `pagar.pandda.vip?ref=${Session.id}`;
                    logger('DISCORD', 'Webhook: Novo Pagamento', { url: url, plan: Session.data.plan });
                    return { text: [`Resumo:\nPlano ${Session.data.plan}\nLink: ${url}`], newState: 'MENU' };
                }
            }
        };

        const FlowTesting = {
            start: () => ({ text: ["Instale o app: pandda.vip/guia\n1-Agora | 2-Agendar"], newState: 'TEST_OPT' }),
            handle: (inp, state) => {
                if(state === 'TEST_OPT') return { text: ["Qual seu nome?"], newState: 'TEST_NAME' };
                if(state === 'TEST_NAME') {
                    Session.data.name = inp;
                    logger('DISCORD', 'Webhook: Teste Solicitado', Session.data);
                    return { text: [`Obrigado ${inp}, teste gerado!`], newState: 'MENU' };
                }
            }
        };
        
        const FlowFAQ = {
            start: () => {
                const qs = ["**Onde usar?** 🌍 TV e Celular.", "**Pagamento?** 💳 Pix/Cartão."];
                return { text: ["FAQ:", ...shuffleMessages(qs)], newState: 'MENU' };
            }
        };

        /* =================================================================
           CONTROLLER & UI
           ================================================================= */
        
        async function processMessage(msg) {
            const clean = msg.trim();
            if(clean === '0') {
                Session.state = 'MENU';
                sendBot(FlowMenu.getGreeting());
                return;
            }

            let res = { text: [], newState: Session.state };
            
            if(Session.state === 'START' || Session.state === 'MENU') {
                if(Session.state === 'START') res = { text: FlowMenu.getGreeting(), newState: 'MENU' };
                else res = FlowMenu.handle(clean);
            }
            else if(Session.state.startsWith('SIGN')) res = FlowSigning.handle(clean, Session.state);
            else if(Session.state.startsWith('TEST')) res = FlowTesting.handle(clean, Session.state);

            if(res.newState) {
                Session.state = res.newState;
                DB.saveSession(Session); // Salva no DB a cada mudança de estado
            }
            updateStatusUI();
            if(res.text) await sendBot(res.text);
        }

        function addMsg(html, type) {
            const box = document.getElementById('chatBox');
            box.innerHTML += `<div class="message ${type}">${html.replace(/\n/g,'<br>')}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function sendBot(msgs) {
            const ind = document.getElementById('typingIndicator');
            for(let m of msgs) {
                const txt = processSpintax(m);
                ind.style.display = 'block';
                await new Promise(r => setTimeout(r, Math.min(txt.length*50, 2000))); // Delay simulado
                ind.style.display = 'none';
                addMsg(txt, 'bot');
                await new Promise(r => setTimeout(r, 500));
            }
        }

        function sendUserMessage() {
            const inp = document.getElementById('userInput');
            const txt = inp.value;
            if(!txt) return;
            addMsg(txt, 'user');
            inp.value = '';
            processMessage(txt);
        }

        function handleEnter(e) { if(e.key === 'Enter') sendUserMessage(); }
        
        function restartChat() {
            document.getElementById('chatBox').innerHTML = '';
            Session.state = 'START';
            Session.data = {};
            logger('SYSTEM', 'Chat Reiniciado', {});
            sendBot(["Olá!"]);
        }
        function clearLogs() { document.getElementById('logsPanel').innerHTML = ''; }
        function toggleConfig() { document.getElementById('appContainer').classList.toggle('show-config'); }

        // Init
        logger('SYSTEM', 'Pandda Engine v2.0 Started', { platform: 'Browser', mock_db: true });
        sendBot(["Olá! Digite algo."]);

    </script>
</body>
</html>
