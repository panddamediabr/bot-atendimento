<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pandda Engine Pro 🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <aside class="settings-panel">
            <h2>⚙️ Configurações</h2>
            <div class="time-box">
                <label class="time-label">⏰ Horário Simulado</label>
                <input type="time" id="simulatedTime" value="09:00" onchange="syncTime(this.value)">
                <div class="hint-text">Define Bom dia/Tarde/Noite</div>
            </div>
            
            <div class="form-group">
                <label>Expediente Teste</label>
                <div style="display:flex; gap:5px;">
                    <input type="time" id="workStart" value="09:00">
                    <input type="time" id="workEnd" value="20:00">
                </div>
            </div>

            <div class="form-group">
                <label>Velocidade Humana (ms)</label>
                <input type="number" id="msPerChar" value="60">
            </div>

            <div class="form-group">
                <label>Códigos Válidos</label>
                <input type="text" id="validCodes" value="PANDDA10, TESTE">
            </div>
            
            <button class="btn-action" onclick="restartChat()">🔄 Nova Sessão</button>
            <div class="status-box">
                <div>ESTADO: <span id="displayState" class="highlight">START</span></div>
                <div>1º CONTATO: <span id="displayFirstContact" class="highlight-bool">true</span></div>
            </div>
        </aside>

        <main class="chat-area">
            <details class="mobile-config-card">
                <summary>Variáveis & Controle 🐼</summary>
                <div class="config-content">
                    <div class="form-group">
                        <label>Horário Simulado:</label>
                        <input type="time" id="simulatedTimeMobile" value="09:00" onchange="syncTime(this.value)">
                    </div>
                    <div class="status-box-mobile">
                        ESTADO: <span id="displayStateMobile" style="color:var(--primary)">START</span>
                    </div>
                    <button class="btn-action" onclick="restartChat()">Reiniciar Sessão</button>
                </div>
            </details>

            <div class="phone-mockup">
                <div class="chat-header">
                    <div class="header-info">
                        <div class="profile-pic">🐼</div>
                        <div><b>Pandda Bot</b><div style="font-size:0.7rem; opacity:0.8;">Online</div></div>
                    </div>
                    <div id="phoneClock" style="font-size:0.8rem; font-weight:bold;">09:00</div>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                    <button onclick="sendUserMessage()" class="send-btn">➤</button>
                </div>
            </div>
        </main>

        <aside class="logs-panel" id="logsPanel"></aside>

    </div>

    <script src="config.js"></script>
    <script src="engine.js"></script>
    <script src="flows.js"></script>
    <script src="main.js"></script>
</body>
</html>
