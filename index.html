<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pandda Bot - Anti-Ban System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; opacity: 0.1; position: absolute; top:0; left:0; right:0; bottom:0; z-index: 0; }
        .message-in { background-color: #202c33; border-radius: 0 10px 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 85%; position: relative; z-index: 10; font-size: 14px; word-wrap: break-word; }
        .message-out { background-color: #005c4b; border-radius: 10px 0 10px 10px; padding: 8px 10px; margin-bottom: 10px; max-width: 85%; margin-left: auto; position: relative; z-index: 10; font-size: 14px; word-wrap: break-word; }
        .json-view { font-family: 'Courier New', Courier, monospace; font-size: 11px; line-height: 1.4; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111b21; }
        ::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row">

    <div class="flex-1 md:w-1/3 flex flex-col border-r border-gray-700 relative bg-[#0b141a] min-h-0">
        <div class="chat-bg pointer-events-none"></div>
        
        <div class="bg-[#202c33] p-3 flex items-center justify-between z-20 shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white font-bold shrink-0">P</div>
                <div class="overflow-hidden">
                    <h3 class="font-semibold text-gray-100 truncate">Pandda Bot</h3>
                    <p class="text-xs text-green-400">● Online (Anti-Ban Ativo)</p>
                </div>
            </div>
            <div class="flex flex-col items-end shrink-0">
                <label class="text-[10px] text-gray-400">Hora Simulada:</label>
                <input type="number" id="simulatedHour" class="bg-gray-700 text-white text-xs p-1 rounded w-14 text-center" min="0" max="23" value="10">
            </div>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 z-10 flex flex-col scroll-smooth"></div>

        <div class="bg-[#202c33] p-2 md:p-3 flex gap-2 z-20 shrink-0 pb-safe"> 
            <input type="text" id="userInput" class="flex-1 bg-[#2a3942] rounded-lg px-4 py-3 text-white outline-none focus:ring-1 focus:ring-green-500 text-sm md:text-base" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-[#00a884] w-12 h-12 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-[#008f6f] transition shrink-0"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="md:w-2/3 bg-[#0b141a] flex flex-col border-t md:border-t-0 md:border-l border-gray-700 transition-all duration-300 ease-in-out shrink-0" id="dashboardPanel">
        
        <div onclick="toggleDashboard()" class="p-3 bg-[#1f2937] flex justify-between items-center cursor-pointer md:cursor-default border-b border-gray-700 md:border-none shrink-0">
            <h2 class="text-sm md:text-xl font-bold text-green-400 flex items-center">
                <i class="fas fa-microchip mr-2"></i>Painel de Controle
                <span class="text-[10px] text-gray-400 font-normal ml-2 md:hidden">(Toque para abrir)</span>
            </h2>
            <div class="flex gap-3 items-center">
                <button onclick="resetSystem(); event.stopPropagation();" class="text-[10px] bg-red-600 px-2 py-1 rounded hover:bg-red-700 whitespace-nowrap">Reiniciar</button>
                <i id="toggleIcon" class="fas fa-chevron-up md:hidden text-gray-400 transition-transform"></i>
            </div>
        </div>

        <div id="dashboardContent" class="hidden md:grid md:grid-cols-2 grid-rows-2 gap-4 p-4 h-64 md:h-full overflow-y-auto bg-[#0b141a]">
            
            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg col-span-2 h-48 md:h-auto">
                <h3 class="text-yellow-400 font-bold mb-2 text-xs uppercase flex justify-between">
                    <span><i class="fas fa-random mr-2"></i>Anti-Ban Engine (Construção da Msg)</span>
                    <span class="text-[10px] text-gray-500">Log em tempo real</span>
                </h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-yellow-100" id="textEngineLog">
                    // Aguardando geração de mensagens...
                </div>
            </div>

            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg h-40 md:h-auto">
                <h3 class="text-blue-400 font-bold mb-2 text-xs uppercase"><i class="fas fa-database mr-2"></i>Estado da Sessão (Supabase)</h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-green-300" id="supabaseView"></div>
            </div>

            <div class="bg-[#1f2937] rounded-lg p-3 flex flex-col border border-gray-700 shadow-lg h-40 md:h-auto">
                <h3 class="text-indigo-400 font-bold mb-2 text-xs uppercase"><i class="fab fa-discord mr-2"></i>Webhooks Disparados</h3>
                <div class="flex-1 bg-black rounded p-2 overflow-y-auto json-view text-gray-300" id="logsView"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DE TEXTOS DINÂMICOS (ANTI-BAN) ---
        
        const SYNONYMS = {
            "{saudacao_dia}": ["Bom dia", "Um ótimo dia", "Dia bom", "Olá, bom dia", "Salve, bom dia"],
            "{saudacao_tarde}": ["Boa tarde", "Uma ótima tarde", "Tarde boa", "Olá, boa tarde", "Salve, boa tarde"],
            "{saudacao_noite}": ["Boa noite", "Uma ótima noite", "Noite boa", "Olá, boa noite", "Salve, boa noite"],
            "{emoji_feliz}": ["🐼", "😃", "👊", "👋", "✅"],
            "{emoji_atencao}": ["⚠️", "❗", "🛑", "👀", "🔔"],
            "{verbo_ajuda}": ["ajudar", "auxiliar", "ser útil", "dar um suporte", "te atender"],
            "{nome_bot}": ["Pandda Bot", "Assistente Pandda", "Pandda Virtual", "Seu Assistente", "Robô Pandda"],
            "{menu_intro}": ["Escolha uma opção:", "Digite o número desejado:", "Como podemos prosseguir?", "Selecione abaixo:", "O que você precisa agora?"]
        };

        const TEXT_VARIANTS = {
            "GREETING": [
                "{saudacao}! Bem-vindo ao *Pandda IPTV*. Eu sou o {nome_bot}.",
                "{emoji_feliz} {saudacao}! Você está no canal oficial do *Pandda*. Como posso {verbo_ajuda}?",
                "Opa, {saudacao}! {nome_bot} na área. Vamos agilizar seu atendimento.",
                "{saudacao}. Aqui é o sistema automático do Pandda. {emoji_feliz}",
                "Olá! {saudacao}. Sou a inteligência artificial do Pandda e vou te {verbo_ajuda} hoje."
            ],
            "MENU_MAIN": [
                "{menu_intro}\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente",
                "Aqui está nosso menu principal. {menu_intro}\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente",
                "Para começar, {menu_intro}\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente",
                "Certo! Veja as opções disponíveis:\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente",
                "Menu de Autoatendimento:\n\n1️⃣ Como funciona\n2️⃣ Planos\n3️⃣ Assine\n4️⃣ Teste Gratuito\n5️⃣ Dúvidas Frequentes\n6️⃣ Falar com atendente"
            ],
            "PLAN_INFO": [
                "*Nossos Planos* 📺\n\nBase (1 Tela): R$ 34,90\nTela Extra: + R$ 17,90\n\nQualidade máxima garantida!",
                "💲 *Preços Atuais:*\n\nPlano DualAPP: R$ 34,90 (1 conexão)\nAdicional: R$ 17,90 por tela.\n\nO melhor custo benefício!",
                "Confira os valores: {emoji_feliz}\n\n🔹 1 Tela: 34,90/mês\n🔹 Tela Extra: 17,90/mês\n\nAcesso a canais e VODs inclusos.",
                "Tabela de Planos:\n\n✅ Principal: R$ 34,90\n✅ Ponto Extra: R$ 17,90\n\nEstabilidade e qualidade 4K/FHD.",
                "Quanto custa? 🤔\n\nSua assinatura sai por apenas R$ 34,90. Precisa de mais telas? Só R$ 17,90 cada."
            ],
            "TEST_INTRO": [
                "Para testar é simples! Instale 2 apps do guia: pandda.vip/guia. O teste dura 6h.",
                "Quer testar? {emoji_feliz} Baixe nossos apps em pandda.vip/guia. Liberamos 6 horas grátis.",
                "Bora testar! Acesse pandda.vip/guia, instale e me avise. O acesso dura 6 horas.",
                "Teste Grátis de 6h! 🚀 Primeiro, certifique-se de instalar os apps: pandda.vip/guia",
                "Experimente sem compromisso (6 horas). Guia de instalação: pandda.vip/guia"
            ],
            "ERROR_DEFAULT": [
                "{emoji_atencao} Não entendi. Escolha uma opção do menu.",
                "Opção inválida. Por favor, tente novamente digitando o número.",
                "Ops! Não reconheci esse comando. Digite o número da opção.",
                "Comando desconhecido. Veja o menu e digite o número.",
                "{emoji_atencao} Digite apenas o número da opção desejada."
            ]
        };

        // --- LÓGICA DO GERADOR DE TEXTO ---

        function getDynamicText(key, context = {}) {
            // 1. Sorteia um template da lista (Ex: 1 de 5)
            const templates = TEXT_VARIANTS[key] || TEXT_VARIANTS["ERROR_DEFAULT"];
            let template = templates[Math.floor(Math.random() * templates.length)];
            const originalTemplate = template; // Para log

            // 2. Define saudação baseada na hora
            const hour = parseInt(document.getElementById('simulatedHour').value);
            let timeKey = "{saudacao_noite}";
            if (hour >= 5 && hour < 12) timeKey = "{saudacao_dia}";
            else if (hour >= 12 && hour < 18) timeKey = "{saudacao_tarde}";
            
            // 3. Substitui a saudação específica
            template = template.replace("{saudacao}", getRandomSynonym(timeKey));

            // 4. Substitui todos os outros placeholders genéricos
            template = template.replace(/{(\w+)}/g, (match) => {
                return getRandomSynonym(match) || match;
            });

            // 5. Loga o processo de "Spin"
            logTextEngine(key, originalTemplate, template);

            return template;
        }

        function getRandomSynonym(key) {
            const list = SYNONYMS[key];
            if (!list) return null;
            return list[Math.floor(Math.random() * list.length)];
        }

        function logTextEngine(key, original, final) {
            const view = document.getElementById('textEngineLog');
            const entry = `
<div class="mb-2 border-b border-gray-700 pb-2">
    <span class="text-blue-400 font-bold">[${key}]</span>
    <div class="text-gray-500">Template: "${original}"</div>
    <div class="text-green-400 mt-1">Final: "${final}"</div>
</div>`;
            view.innerHTML = entry + view.innerHTML;
        }

        // --- SISTEMA LÓGICO (BOT) ---

        const CONFIG = {
            prices: { base: 34.90, extra: 17.90 },
            hours: { open: 9, close: 20 },
            links: { payment: "https://pagar.pandda.vip/", guide: "pandda.vip/guia", faq: "pandda.vip/FAQ" }
        };

        let session = { phone: "5511999999999", status: "IDLE", step: 0, last_interaction: new Date(), temp_data: {} };

        function processBotLogic(input) {
            const hour = parseInt(document.getElementById('simulatedHour').value);
            const cleanInput = input.trim();
            
            session.last_interaction = new Date();
            updateSupabaseView();

            if (session.status === "IDLE") {
                botReply(getDynamicText("GREETING"));
                setTimeout(() => {
                    botReply(getDynamicText("MENU_MAIN"));
                    session.status = "MENU";
                }, 1000);
                return;
            }

            switch (session.status) {
                case "MENU": handleMenu(cleanInput); break;
                case "TEST_FLOW": handleTestFlow(cleanInput, hour); break;
                case "BUY_FLOW": handleBuyFlow(cleanInput); break;
                default:
                    botReply("Erro de estado. Digite 'oi' para reiniciar.");
                    session.status = "IDLE";
            }
        }

        function handleMenu(input) {
            switch (input) {
                case "1": 
                    botReply(`*Como funciona o Plano DualAPP*\n\nÉ simples! Instale o APP adequado clicando no nosso guia completo: ${CONFIG.links.guide}\n\n✅ Compatível com Smart TVs, TV Box, Celulares.\n✅ Funciona via Internet.\n✅ Validade de 30 dias.`);
                    setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 3000); 
                    break;
                case "2": 
                    botReply(getDynamicText("PLAN_INFO"));
                    setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 3000);
                    break;
                case "3": startBuyFlow(); break;
                case "4": startTestFlow(); break;
                case "5": 
                    botReply(`*Dúvidas Frequentes*\n\n🔗 Para mais dúvidas acesse: ${CONFIG.links.faq}`);
                    setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 3000);
                    break;
                case "6": 
                    botReply("Um atendente humano foi notificado. Aguarde.");
                    addLog("DISCORD", "🔔 ALERTA: Solicitação de atendimento humano.");
                    break;
                default: botReply(getDynamicText("ERROR_DEFAULT")); break;
            }
        }

        function startBuyFlow() {
            session.status = "BUY_FLOW";
            session.step = 1;
            botReply(`*Assinatura DualAPP* 🚀\n\n1️⃣ Quero assinar o Plano Base\n2️⃣ Quero adicionar mais telas`);
        }

        function handleBuyFlow(input) {
            if (session.step === 1) {
                if (input === "1") { generateCheckout(1); } 
                else if (input === "2") {
                    session.step = 2;
                    botReply("Quantas telas gostaria no total? (Digite 2 ou 3)");
                } else { botReply("Digite 1 ou 2."); }
                return;
            }
            if (session.step === 2) {
                if (["2", "3"].includes(input)) {
                    generateCheckout(parseInt(input));
                } else { botReply("Por favor, digite 2 ou 3."); }
            }
        }

        function generateCheckout(screens) {
            const code = Math.random().toString(36).substring(7).toUpperCase();
            const total = CONFIG.prices.base + (CONFIG.prices.extra * (screens - 1));
            botReply(`Gerando link para ${screens} telas (R$${total.toFixed(2)})...`);
            setTimeout(() => {
                botReply(`Pagamento seguro: ${CONFIG.links.payment}${code}\n\nAguardamos a confirmação.`);
                addLog("MERCADOPAGO", `Link gerado: ${code} | R$${total}`);
                session.status = "IDLE";
            }, 1000);
        }

        function startTestFlow() {
            session.status = "TEST_FLOW";
            botReply(getDynamicText("TEST_INTRO"));
            
            setTimeout(() => {
                const hour = parseInt(document.getElementById('simulatedHour').value);
                if (hour >= CONFIG.hours.open && hour < CONFIG.hours.close) {
                    session.step = 1; 
                    botReply("1️⃣ Iniciar teste agora\n2️⃣ Agendar para outro horário");
                } else {
                    session.step = 2; 
                    session.temp_data.mode = "SCHEDULE";
                    botReply(`Estamos fora do horário comercial (09h às 20h). Vamos agendar!`);
                    askReferral();
                }
            }, 1500);
        }

        function handleTestFlow(input, currentHour) {
            // Lógica simplificada para focar na demonstração do Anti-Ban
            if (session.step === 1) {
                if (input === "1") { session.temp_data.mode = "NOW"; askReferral(); }
                else if (input === "2") { session.temp_data.mode = "SCHEDULE"; askReferral(); }
                else { botReply("Digite 1 ou 2."); }
                return;
            }
            if (session.step === 2) { // Referral Check
                if (input.length > 3 && input.toLowerCase() !== 'não') {
                    botReply("✅ Código válido! (24h liberadas)");
                } else {
                    botReply("Sem código (6h liberadas).");
                }
                session.step = 4; // Pula agendamento pra simplificar demo
                botReply("Qual seu nome?");
                return;
            }
            if (session.step === 4) { // Finalização
                session.temp_data.name = input;
                botReply(`Obrigado, ${input}. Solicitação enviada!`);
                addLog("DISCORD", `Novo Teste: ${input} | Modo: ${session.temp_data.mode}`);
                session.status = "IDLE";
                setTimeout(() => botReply(getDynamicText("MENU_MAIN")), 2000);
            }
        }

        function askReferral() {
            session.step = 2; 
            botReply("Você possui código de indicação? (Digite o código ou 'não')");
        }

        // --- FUNÇÕES DE INTERFACE ---

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value;
            if (!text) return;
            
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-out text-white';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(() => processBotLogic(text), 600);
        }

        function botReply(text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-in text-white';
            msgDiv.innerHTML = text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateSupabaseView() {
            document.getElementById('supabaseView').innerText = JSON.stringify(session, null, 4);
        }

        function addLog(type, message) {
            const view = document.getElementById('logsView');
            const timestamp = new Date().toLocaleTimeString();
            view.innerHTML = `[${timestamp}] [${type}] ${message}\n` + view.innerHTML;
        }

        function resetSystem() {
            session = { phone: "5511999999999", status: "IDLE", step: 0, last_interaction: new Date(), temp_data: {} };
            document.getElementById('chatBox').innerHTML = '';
            document.getElementById('logsView').innerHTML = '';
            document.getElementById('textEngineLog').innerHTML = '// Logs resetados...';
            updateSupabaseView();
            botReply("Sistema reiniciado. Digite 'oi'.");
        }

        function toggleDashboard() {
            if (window.innerWidth >= 768) return;
            const content = document.getElementById('dashboardContent');
            const icon = document.getElementById('toggleIcon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); content.classList.add('grid'); icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden'); content.classList.remove('grid'); icon.classList.remove('rotate-180');
            }
        }

        // Início
        botReply("Sistema Inicializado (Modo Anti-Ban Ativo). Digite 'oi' para testar a variação.");
        updateSupabaseView();
    </script>
</body>
</html>
